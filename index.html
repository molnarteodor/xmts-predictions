function calculateExpiresAt(duration) {
  const now = new Date();
  if (duration === 'trial') now.setDate(now.getDate() + 2);
  else if (duration === '1_month') now.setMonth(now.getMonth() + 1);
  else if (duration === '3_months') now.setMonth(now.getMonth() + 3);
  else if (duration === '6_months') now.setMonth(now.getMonth() + 6);
  else if (duration === '1_year') now.setFullYear(now.getFullYear() + 1);
  else now.setMonth(now.getMonth() + 1);
  return now.toISOString();
}

function formatExpiryDate(isoStr) {

function extractMarketOdds(comp) {
  if (!comp.odds || !Array.isArray(comp.odds) || comp.odds.length === 0) return null;
  const oddObj = comp.odds.find(o => o && (o.homeTeamOdds || o.overUnder)) || comp.odds[0];
  if (!oddObj) return null;
  const mlToDec = (ml) => { const n = parseFloat(ml); if (isNaN(n) || n === 0) return null; return n > 0 ? 1 + (n / 100) : 1 + (100 / Math.abs(n)); };
  let mktPH = null, mktPD = null, mktPA = null, decH = null, decD = null, decA = null;
  if (oddObj.homeTeamOdds && oddObj.awayTeamOdds) {
    decH = mlToDec(oddObj.homeTeamOdds.moneyLine);
    decA = mlToDec(oddObj.awayTeamOdds.moneyLine);
    decD = oddObj.drawOdds ? mlToDec(oddObj.drawOdds.moneyLine) : null;
    if (decH && decA) {
      const gap = Math.abs(1 / decH - 1 / decA);
      const dynamicDrawOdd = Math.min(6.80, Math.max(3.15, 3.25 + gap * 3.8));
      const effD = decD || dynamicDrawOdd;
      const invH = 1 / decH, invD = 1 / effD, invA = 1 / decA, overround = invH + invD + invA;
      mktPH = invH / overround; mktPD = invD / overround; mktPA = invA / overround;
    }
  }
  const ouLine = oddObj.overUnder ? parseFloat(oddObj.overUnder) : null;
  return { mktPH, mktPD, mktPA, decH, decD, decA, ouLine };
}

function extractRealTeamProfile(compObj, isHome, teamName, slug) {
  const baseP = power(teamName, slug);
  let recScore = null, venueScore = null, formScore = null, drawRatio = 0.25;

  if (compObj.records && Array.isArray(compObj.records)) {
    const parseRec = (rec) => {
      if (!rec || !rec.summary) return null;
      const parts = rec.summary.split("-").map(x => parseInt(x, 10));
      if (parts.length === 3 && !isNaN(parts[0])) {
        const [w, d, l] = parts, tot = w + d + l;
        if (tot > 0) return { w, d, l, tot, ppg: (w * 3 + d) / tot };
      }
      return null;
    };
    const totalRec = parseRec(compObj.records.find(r => r.type === "total") || compObj.records[0]);
    const venueRec = parseRec(compObj.records.find(r => r.type === (isHome ? "home" : "road") || (r.name && r.name.toLowerCase() === (isHome ? "home" : "away"))));
    if (totalRec) {
      const rel = Math.min(1.0, totalRec.tot / (totalRec.tot + 5));
      recScore = (totalRec.ppg - 1.36) * 0.42 * rel;
      drawRatio = (totalRec.d / totalRec.tot) * rel + 0.25 * (1 - rel);
    }
    if (venueRec && venueRec.tot >= 2) {
      const vRel = Math.min(1.0, venueRec.tot / (venueRec.tot + 4));
      venueScore = (venueRec.ppg - (isHome ? 1.52 : 1.18)) * 0.36 * vRel;
    }
  }

  if (compObj.form && typeof compObj.form === "string") {
    const raw = compObj.form.toUpperCase().replace(/[^WDL]/g, "").slice(-5);
    if (raw.length >= 3) {
      const weights = [0.65, 0.80, 1.0, 1.18, 1.35];
      let fs = 0, dCount = 0;
      for (let i = 0; i < raw.length; i++) {
        const ch = raw[i], w = weights[i + (5 - raw.length)] || 1.0;
        if (ch === "W") fs += 0.055 * w;
        else if (ch === "L") fs -= 0.055 * w;
        else dCount++;
      }
      formScore = fs;
      drawRatio = drawRatio * 0.7 + (dCount / raw.length) * 0.3;
    }
  }

  const hasStats = recScore !== null || formScore !== null;
  let empirical = 0;
  if (recScore !== null && venueScore !== null) empirical = recScore * 0.65 + venueScore * 0.35;
  else if (recScore !== null) empirical = recScore;
  if (formScore !== null) empirical = recScore !== null ? (empirical * 0.68 + formScore * 0.32) : formScore;

  let finalPower = 0;
  if (baseP !== null && hasStats) finalPower = baseP * 0.55 + empirical * 0.45;
  else if (baseP !== null) finalPower = baseP;
  else if (hasStats) finalPower = empirical;

  const summaryStr = [(compObj.records && compObj.records[0] && compObj.records[0].summary) || "", compObj.form || ""].filter(Boolean).join(" · ") || (baseP !== null ? "Power Matrix" : "—");

  return {
    power: Math.max(-0.55, Math.min(0.65, finalPower)),
    drawRatio: Math.max(0.14, Math.min(0.38, drawRatio)),
    hasData: baseP !== null || hasStats,
    formLabel: summaryStr
  };
}

function poissonPmf(k, lam) {
  let f = 1; for (let i = 2; i <= k; i++) f *= i;
  return Math.exp(-lam) * Math.pow(lam, k) / f;
}

function poissonOverProb(line, lam) {
  const minK = Math.floor(line) + 1; let cdf = 0;
  for (let k = 0; k < minK; k++) cdf += poissonPmf(k, lam);
  return Math.max(0.05, Math.min(0.95, 1 - cdf));
}

function selectOptimalStatLine(expVal, overLines, underLines) {
  const options = [];
  for (let l of overLines) {
    const p = poissonOverProb(l, expVal);
    if (p >= 0.55 && p <= 0.78) options.push({ label: `Peste ${l}`, prob: Math.round(p * 100), score: p * (1 - Math.abs(p - 0.66) * 1.4) });
  }
  for (let l of underLines) {
    const p = 1 - poissonOverProb(l, expVal);
    if (p >= 0.57 && p <= 0.77) options.push({ label: `Sub ${l}`, prob: Math.round(p * 100), score: p * (1 - Math.abs(p - 0.66) * 1.4) * 0.98 });
  }
  if (!options.length) {
    const midLine = overLines[1] || overLines[0], p = poissonOverProb(midLine, expVal);
    return p >= 0.50 ? { label: `Peste ${midLine}`, prob: Math.round(p * 100) } : { label: `Sub ${midLine + 1}`, prob: Math.round((1 - poissonOverProb(midLine + 1, expVal)) * 100) };
  }
  options.sort((a, b) => b.score - a.score);
  return options[0];
}

function dixonColesTau(h, a, lamH, lamA, rho = -0.09) {
  if (h === 0 && a === 0) return Math.max(0.5, 1 - lamH * lamA * rho);
  if (h === 0 && a === 1) return Math.max(0.5, 1 + lamH * rho);
  if (h === 1 && a === 0) return Math.max(0.5, 1 + lamA * rho);
  if (h === 1 && a === 1) return Math.max(0.5, 1 - rho);
  return 1.0;
}

function probsGrid(lH,lA,rho){
  const ph=[],pa=[];let f=1;
  for(let k=0;k<10;k++){if(k>1)f*=k;ph[k]=Math.exp(-lH)*Math.pow(lH,k)/f;pa[k]=Math.exp(-lA)*Math.pow(lA,k)/f;}
  let s=0,H=0,D=0,A=0,o15=0,o25=0,o35=0,gg=0,dc1X_o15=0,dcX2_o15=0,dc1X_u35=0,dcX2_u35=0;
  for(let h=0;h<10;h++)for(let a=0;a<10;a++){
    const p=ph[h]*pa[a]*dixonColesTau(h,a,lH,lA,rho),t=h+a;s+=p;
    if(h>a)H+=p;else if(h===a)D+=p;else A+=p;
    if(t>=2)o15+=p;if(t>=3)o25+=p;if(t>=4)o35+=p;if(h&&a)gg+=p;
    if(h>=a&&t>=2)dc1X_o15+=p;
    if(a>=h&&t>=2)dcX2_o15+=p;
    if(h>=a&&t<=3)dc1X_u35+=p;
    if(a>=h&&t<=3)dcX2_u35+=p;
  }
  return{
    H:H/s,D:D/s,A:A/s,o15:o15/s,o25:o25/s,u35:1-o35/s,gg:gg/s,
    dc1X_o15:dc1X_o15/s,dcX2_o15:dcX2_o15/s,dc1X_u35:dc1X_u35/s,dcX2_u35:dcX2_u35/s
  };
}

function fitToMarket(mH,mD,mA,tPrior,w,rho){
  let best=null;
  for(let T=1.75;T<=4.15;T+=0.05)for(let sh=0.14;sh<=0.86;sh+=0.01){
    const g=probsGrid(T*sh,T*(1-sh),rho);
    const e=(g.H-mH)**2+(mD==null?0:(g.D-mD)**2*0.65)+(g.A-mA)**2+w*(T-tPrior)**2;
    if(!best||e<best.e)best={e,lH:T*sh,lA:T*(1-sh),g};
  }
  return best;
}

function analyzeMatch(ev,lg){
  const comp=ev.competitions[0],cs=comp.competitors;
  const home=cs.find(c=>c.homeAway==="home")||cs[0],away=cs.find(c=>c.homeAway==="away")||cs[1];
  const hName=home.team.displayName||home.team.name,aName=away.team.displayName||away.team.name;
  const dt=new Date(comp.date||ev.date),stState=(comp.status&&comp.status.type&&comp.status.type.state)||"pre";
  const sc=c=>c.score!==undefined?parseInt(c.score,10):null;
  const ht=c=>(c.linescores&&c.linescores.length&&c.linescores[0].value!==undefined)?parseInt(c.linescores[0].value,10):null;

  const hProf=extractRealTeamProfile(home,true,hName,lg.slug);
  const aProf=extractRealTeamProfile(away,false,aName,lg.slug);
  const lowData=!hProf.hasData&&!aProf.hasData;
  const diff=hProf.power-aProf.power;
  const isDerby=Math.abs(diff)<=0.12&&hProf.power>=0.24&&aProf.power>=0.24;

  const rho=(lg.rho||-0.09)+(isDerby?-0.02:0),gBase=lg.gBase||2.62;
  const avgDraw=(hProf.drawRatio+aProf.drawRatio)/2;
  const paceMod=(0.25-avgDraw)*0.65+(hProf.power+aProf.power)*0.22+Math.abs(diff)*0.28;
  const teamExpectedT=Math.max(2.05,Math.min(3.45,gBase+paceMod));
  const modelShare=Math.min(0.80,Math.max(0.20,1/(1+Math.exp(-(0.15+diff*1.85)))));

  const mkt=extractMarketOdds(comp);
  const hasMkt=!!(mkt&&mkt.mktPH&&mkt.mktPA);
  let src="model",lH,lA,g;

  if(hasMkt){
    const tp=(mkt.ouLine>=1.5&&mkt.ouLine<=4.0)?(mkt.ouLine*0.65+teamExpectedT*0.35):teamExpectedT;
    const f=fitToMarket(mkt.mktPH,mkt.decD?mkt.mktPD:null,mkt.mktPA,tp,mkt.ouLine?0.06:0.045,rho);
    lH=f.lH*0.85+(teamExpectedT*modelShare)*0.15;
    lA=f.lA*0.85+(teamExpectedT*(1-modelShare))*0.15;
    g=probsGrid(lH,lA,rho);
    src="market";
  }else{
    lH=teamExpectedT*modelShare;
    lA=teamExpectedT*(1-modelShare);
    g=probsGrid(lH,lA,rho);
  }

  const T=lH+lA;
  const c=[];
  const add=(name,mk,p,realOdd,typeBonus=1.0)=>{
    const bookieOdd=realOdd?+realOdd.toFixed(2):Math.max(1.18,+(0.94/Math.max(0.12,p)).toFixed(2));
    const fairOdd=+(1/Math.max(0.12,p)).toFixed(2);
    const edge=realOdd?Math.round((p*realOdd-1)*100):0;
    const distFromSweet=Math.abs(p-0.67);
    const sweetFactor=Math.max(0.72,1-distFromSweet*1.35);
    const utility=p*sweetFactor*typeBonus*(edge>0?1.05:1.0);
    c.push({name,mk,p,odd:bookieOdd,fairOdd,real:!!realOdd,edge,utility});
  };

  add(`1 (${hName})`,"SOLO",g.H,hasMkt?mkt.decH:null,1.03);
  add(`2 (${aName})`,"SOLO",g.A,hasMkt?mkt.decA:null,1.03);
  add("Șansă Dublă 1X","DC",g.H+g.D,null,0.98);
  add("Șansă Dublă X2","DC",g.A+g.D,null,0.98);
  add("Peste 1.5 Goluri","O15",g.o15,null,0.96);
  add("Peste 2.5 Goluri","O25",g.o25,null,1.04);
  add("Sub 2.5 Goluri","U25",1-g.o25,null,1.01);
  add("Sub 3.5 Goluri","U35",g.u35,null,0.94);
  if(lH>=0.92&&lA>=0.92)add("GG (Ambele marchează)","GG",g.gg,null,1.04);
  if(diff>=0.08&&T>=2.35)add("1X & Peste 1.5 Goluri","COMBO_DC",g.dc1X_o15,null,1.05);
  if(diff<=-0.08&&T>=2.35)add("X2 & Peste 1.5 Goluri","COMBO_DC",g.dcX2_o15,null,1.05);

  let pool=c.filter(x=>x.p>=0.57&&x.p<=0.80&&x.odd>=1.25&&x.odd<=2.25);
  if(!pool.length)pool=c.filter(x=>x.p>=0.55&&x.p<=0.84);
  if(!pool.length)pool=c;
  pool.sort((a,b)=>b.utility-a.utility);
  const best=pool[0];

  const stat=(x,ns)=>{for(const n of ns){const f=(x.statistics||[]).find(s=>s.name===n||s.abbreviation===n);if(f){const v=parseFloat(f.displayValue);if(!isNaN(v))return v;}}return null;};
  const hc=stat(home,["wonCorners","cornerKicks","corners","CK"]),ac=stat(away,["wonCorners","cornerKicks","corners","CK"]);
  const hy=stat(home,["yellowCards","YC"]),ay=stat(away,["yellowCards","YC"]);
  const hr=stat(home,["redCards","RC"])||0,ar=stat(away,["redCards","RC"])||0;

  const pressureC=Math.abs(lH-lA)*0.65;
  const expC=Math.max(7.2,Math.min(12.6,(lg.cBase||9.5)+(T-gBase)*1.15+pressureC));
  const balanceK=(1-Math.abs(g.H-g.A))*0.75+(isDerby?0.55:0)+(avgDraw-0.25)*1.8;
  const expK=Math.max(2.6,Math.min(6.4,(lg.kBase||4.3)+balanceK));
  const co=selectOptimalStatLine(expC,[7.5,8.5,9.5],[9.5,10.5]),ko=selectOptimalStatLine(expK,[3.5,4.5],[4.5,5.5]);

  return{
    id:ev.id,league:lg.name,icon:lg.icon,cat:lg.cat,date:roDateStr(dt),time:roTimeStr(dt),
    status:stState==="post"?"FT":(stState==="in"?"LIVE":"NS"),
    home:hName,away:aName,hScore:sc(home),aScore:sc(away),hHT:ht(home),aHT:ht(away),
    hForm:hProf.formLabel,aForm:aProf.formLabel,lamH:lH.toFixed(2),lamA:lA.toFixed(2),
    isDerby,lowData,src,hasMktOdds:hasMkt,edgePct:best.edge||0,
    pick:best.name,mktType:best.mk,prob:Math.round(best.p*100),odd:best.odd,fairOdd:best.fairOdd,oddReal:best.real,
    tipsterScore:best.utility*(src==="market"?1.0:(lowData?0.72:0.88)),
    expCorners:expC.toFixed(1),cornerLine:`${co.label} (${co.prob}%)`,
    actualCorners:(hc!==null&&ac!==null)?hc+ac:null,
    expCards:expK.toFixed(1),cardLine:`${ko.label} (${ko.prob}%)`,
    actualCards:(hy!==null&&ay!==null)?hy+ay+hr+ar:null,
    probs:{p1:Math.round(g.H*100),pX:Math.round(g.D*100),p2:Math.round(g.A*100),o25:Math.round(g.o25*100),gg:Math.round(g.gg*100),o15:Math.round(g.o15*100)}
  };
}

function calculateSmartStake(bankroll, m) {
  let pct = 0.04;
  if (m.edgePct && m.edgePct > 2) {
    const p = m.prob / 100, b = Math.max(0.25, m.odd - 1), kelly = ((p * b - (1 - p)) / b) * 0.30;
    pct = Math.max(0.03, Math.min(0.08, kelly));
  } else {
    if (m.prob >= 66) pct = 0.07; else if (m.prob >= 60) pct = 0.06; else if (m.prob >= 55) pct = 0.05; else pct = 0.04;
  }
  if (m.lowData) pct = Math.min(pct, 0.03);
  return { stake: Math.max(10, Math.round((bankroll * pct) / 5) * 5), pct: Math.round(pct * 100) };
}

function buildOptimalTicket(pool, targetOdd) {
  const target = cota500Mode ? 500 : targetOdd, maxLegs = cota500Mode ? 15 : 11;
  const s = [...(pool || [])].sort((a,b) => b.tipsterScore - a.tipsterScore);
  const picks = []; let tot = 1;
  for (const m of s) {
    if (picks.length >= maxLegs || tot >= target * 0.94) break;
    picks.push({ home: m.home, away: m.away, pick: m.pick, odd: m.odd, prob: m.prob });
    tot *= m.odd;
  }
  return { picks, totalOdd: tot };
}

  } catch(e) {}
  return { activeId: 1, currentDay: 1, currentStake: 10.0, history: [] };

function saveStoredChallengeState(st) {
  try { localStorage.setItem(CHALLENGE_KEY, JSON.stringify(st)); } catch(e) {}

function getTodayChallengePicks() {
  const dayPool = cacheByDate[selectedDate] || [];
  const valid = dayPool.filter(m => m.status === "NS").sort((a,b)=>b.tipsterScore - a.tipsterScore);
  const picks = valid.slice(0, 2);
  let totOdd = picks.reduce((acc, m) => acc * m.odd, 1);
  if (totOdd < 1.3 && valid.length > 2) {
    picks.push(valid[2]);
    totOdd = picks.reduce((acc, m) => acc * m.odd, 1);
  }
  return { picks, totOdd: +Math.max(1.35, Math.min(1.75, totOdd)).toFixed(2) };
}

function settleChallengeDay(outcome, odd, returnAmount) {
  let st = getStoredChallengeState();
  let currentActive = st.history.find(h => h.id === st.activeId);
  if (!currentActive) return;

  currentActive.steps.push({ day: st.currentDay, odd, status: outcome });

  if (outcome === 'WIN') {
    if (st.currentDay >= 16) {
      currentActive.status = 'WIN';
      currentActive.finalReturn = returnAmount;
      alert(`🏆 FELICITĂRI! Ai completat cu succes Challenge #${st.activeId} ajungând la Ziua 16 cu ${returnAmount} RON! Un nou challenge va porni de la zero.`);
      st.activeId += 1;
      st.currentDay = 1;
      st.currentStake = 10.0;
      st.history.push({ id: st.activeId, status: 'RUNNING', currentDay: 1, startStake: 10.0, finalReturn: 0.0, steps: [] });
    } else {
      st.currentDay += 1;
      st.currentStake = returnAmount;
    }
  } else {
    currentActive.status = 'LOSS';
    alert(`✖ Biletul a fost pierdut la Ziua ${st.currentDay}. Întregul proiect a fost resetat. Pornim Challenge #${st.activeId + 1} de la 10 RON.`);
    st.activeId += 1;
    st.currentDay = 1;
    st.currentStake = 10.0;
    st.history.push({ id: st.activeId, status: 'RUNNING', currentDay: 1, startStake: 10.0, finalReturn: 0.0, steps: [] });
  }

  saveStoredChallengeState(st);
  renderViewport();
}

  const searchTerm = (document.getElementById("matchSearchInput")?.value || "").toLowerCase().trim();
  let list = currentNav === "europa" ? europaMatches : (cacheByDate[selectedDate] || []).filter(m => selectedLeague === "ALL" || m.league === selectedLeague);
  if (searchTerm) list = list.filter(m => m.home.toLowerCase().includes(searchTerm) || m.away.toLowerCase().includes(searchTerm) || m.league.toLowerCase().includes(searchTerm));
  if (!list.length) { vp.innerHTML = `<div class="cyber-card" style="text-align:center;padding:26px;color:var(--text-muted);">Niciun meci găsit conform căutării sau programat în această zi.</div>`; return; }
  
  const groups = {};
  list.forEach(m => { if (!groups[m.league]) groups[m.league] = { icon: m.icon, items: [] }; groups[m.league].items.push(m); });
  vp.innerHTML = Object.keys(groups).map(lg => `<div class="cyber-sec-head"><span>${groups[lg].icon} ${lg}</span><span>${groups[lg].items.length} meciuri</span></div>${groups[lg].items.map(renderMatchCard).join("")}`).join("");
}

function selectDay(iso) {
  selectedDate = iso; selectedLeague = "ALL";
  const searchInput = document.getElementById("matchSearchInput");
  if(searchInput) searchInput.value = "";
  loadMatchesForDate(iso);
}

function selectLeague(lg) { selectedLeague = lg; renderViewport(); }

async function switchNav(tab) {
  if ((tab === "proiect" || tab === "challenge") && !hasJoeAccess()) return;
  if (tab === "admin" && !isAdmin()) return;
  currentNav = tab;
  document.querySelectorAll(".hud-nav-item").forEach(b => b.classList.remove("active"));
  const btn = document.getElementById("nav-" + tab);
  if (btn) btn.classList.add("active");
  if (tab === "admin") await fetchAdminUsersList();
  if (tab === "europa") loadEuropaMatches(); else renderViewport();
}

(async function startApp() {
  selectedDate = getDatesList()[1].iso;
  const savedUser = localStorage.getItem("xmts_logged_user");
  const savedAdmToken = sessionStorage.getItem("xmts_adm_token");
  if (savedUser) {
    try {
      const parsed = JSON.parse(savedUser);
      const isExpired = parsed.role !== "admin" && parsed.expires_at && new Date(parsed.expires_at) < new Date();
      if (!isExpired && parsed.username) {
        currentUser = parsed;
        if (parsed.role === "admin" && savedAdmToken) { adminSessionPass = savedAdmToken; await fetchAdminUsersList(); }
        document.getElementById("loginScreen").style.display = "none";
        applyRolePermissions();
      } else {
        localStorage.removeItem("xmts_logged_user");
      }
    } catch (e) {}
  }
  await initProject();
  loadMatchesForDate(selectedDate);
})();
</script>
