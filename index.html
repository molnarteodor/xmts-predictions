<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>JOE PREZICE · Neural HUD</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="favicon.jpg">
<link rel="icon" type="image/jpeg" href="favicon.jpg">

<style>
  :root { --bg:#020408; --card-bg:rgba(10,15,28,0.82); --card-border:rgba(0,243,255,0.22); --neon-cyan:#00f3ff; --neon-gold:#ffb703; --neon-green:#06d6a0; --neon-red:#ef476f; --text-main:#f8fafc; --text-muted:#64748b; }
  * { box-sizing:border-box; margin:0; padding:0; font-family:'Plus Jakarta Sans',sans-serif; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; width:100%; background:var(--bg); color:var(--text-main); overflow:hidden; }
  .app-shell { display:flex; flex-direction:column; height:100dvh; max-width:520px; margin:0 auto; position:relative; }
  
  .login-screen { position:fixed; inset:0; background:radial-gradient(circle at 50% 25%, #091930 0%, #020408 75%); z-index:200; display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-box { width:100%; max-width:380px; background:rgba(10,15,28,0.9); border:1.5px solid var(--neon-cyan); border-radius:24px; padding:28px 22px; box-shadow:0 0 40px rgba(0,243,255,0.2); text-align:center; }
  .login-logo { width:58px; height:58px; border-radius:16px; background:linear-gradient(135deg,var(--neon-cyan),var(--neon-gold)); display:flex; align-items:center; justify-content:center; font-family:'Orbitron',sans-serif; font-weight:900; color:#020408; font-size:24px; margin:0 auto 14px; box-shadow:0 0 20px rgba(0,243,255,0.5); overflow:hidden; }
  .cyber-input { width:100%; background:rgba(2,4,8,0.85); border:1px solid var(--card-border); color:#fff; padding:12px 14px; border-radius:12px; font-size:13px; margin-bottom:12px; outline:none; }
  .cyber-input:focus { border-color:var(--neon-cyan); box-shadow:0 0 12px rgba(0,243,255,0.3); }
  .login-btn { width:100%; background:linear-gradient(90deg,var(--neon-cyan),var(--neon-green)); color:#020408; border:none; padding:13px; border-radius:12px; font-family:'Orbitron',sans-serif; font-weight:900; font-size:13px; cursor:pointer; margin-top:4px; box-shadow:0 0 18px rgba(0,243,255,0.35); }
  
  .top-hud { display:flex; justify-content:space-between; align-items:center; padding:12px 14px; background:rgba(2,4,8,0.92); backdrop-filter:blur(20px); border-bottom:1px solid var(--card-border); z-index:20; }
  .hud-brand { display:flex; align-items:center; gap:10px; }
  .hud-logo { width:38px; height:38px; border-radius:11px; border:1px solid var(--neon-gold); display:flex; align-items:center; justify-content:center; overflow:hidden; box-shadow:0 0 15px rgba(0,243,255,0.4); flex-shrink:0; }
  .hud-title { font-family:'Orbitron',sans-serif; font-size:13px; font-weight:900; letter-spacing:1px; color:#fff; display:block; }
  .hud-status { font-size:9px; color:var(--neon-green); font-weight:700; text-transform:uppercase; }
  .hud-right { display:flex; align-items:center; gap:6px; }
  .hud-bank { background:rgba(6,214,160,0.1); border:1px solid rgba(6,214,160,0.4); color:var(--neon-green); padding:7px 10px; border-radius:12px; font-family:'Orbitron',sans-serif; font-size:11.5px; font-weight:700; cursor:pointer; }
  .refresh-btn { background:rgba(0,243,255,0.12); border:1px solid rgba(0,243,255,0.45); color:var(--neon-cyan); padding:7px 9px; border-radius:12px; font-size:11px; font-weight:800; cursor:pointer; }
  .logout-btn { background:rgba(239,71,111,0.15); border:1px solid var(--neon-red); color:var(--neon-red); padding:7px 9px; border-radius:12px; font-size:11px; font-weight:800; cursor:pointer; }

  .sub-bars { background:rgba(5,9,18,0.6); border-bottom:1px solid var(--card-border); padding:10px 14px 8px; }
  .h-scroll { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px; }
  .h-scroll::-webkit-scrollbar { display:none; }
  .cyber-chip { background:rgba(15,23,42,0.8); border:1px solid var(--card-border); color:var(--text-muted); padding:7px 14px; border-radius:10px; font-size:11px; font-weight:700; white-space:nowrap; cursor:pointer; transition:0.2s; }
  .cyber-chip.active { background:var(--neon-cyan); color:#020408; border-color:var(--neon-cyan); font-weight:800; }
  .cyber-chip-gold.active { background:var(--neon-gold); color:#020408; border-color:var(--neon-gold); box-shadow:0 0 12px rgba(255,183,3,0.4); }
  
  .search-container { padding:8px 14px 2px; background:rgba(5,9,18,0.6); }
  .search-input { width:100%; background:rgba(15,23,42,0.85); border:1px solid var(--card-border); color:#fff; padding:9px 12px; border-radius:10px; font-size:12px; outline:none; }
  .search-input:focus { border-color:var(--neon-cyan); box-shadow:0 0 10px rgba(0,243,255,0.25); }

  .viewport { flex:1; overflow-y:auto; padding:14px 14px 90px; -webkit-overflow-scrolling:touch; }
  .cyber-sec-head { display:flex; justify-content:space-between; align-items:center; background:linear-gradient(90deg,rgba(0,243,255,0.1),rgba(10,15,28,0.6)); border-left:3px solid var(--neon-cyan); border-radius:8px; padding:9px 14px; margin:14px 0 10px; font-family:'Orbitron',sans-serif; font-size:11px; font-weight:700; color:var(--neon-cyan); }
  .cyber-card { background:var(--card-bg); border:1px solid var(--card-border); border-radius:18px; padding:16px; margin-bottom:12px; box-shadow:0 10px 30px rgba(0,0,0,0.6); transition:0.3s; }
  .cyber-card.match-win { border-color:var(--neon-green); box-shadow:0 0 20px rgba(6,214,160,0.25); background:linear-gradient(145deg,rgba(6,214,160,0.08),rgba(10,15,28,0.85)); }
  .cyber-card.match-loss { border-color:var(--neon-red); box-shadow:0 0 20px rgba(239,71,111,0.25); background:linear-gradient(145deg,rgba(239,71,111,0.08),rgba(10,15,28,0.85)); }

  .card-top { display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--text-muted); margin-bottom:10px; }
  .status-badge { padding:3px 9px; border-radius:6px; font-weight:800; font-size:9px; font-family:'Orbitron',sans-serif; }
  .st-live { background:rgba(239,71,111,0.2); color:var(--neon-red); border:1px solid var(--neon-red); }
  .st-ft { background:rgba(6,214,160,0.2); color:var(--neon-green); border:1px solid var(--neon-green); }
  .st-ns { background:rgba(255,255,255,0.05); color:#cbd5e1; border:1px solid rgba(255,255,255,0.1); }
  .teams-container { display:flex; justify-content:space-between; align-items:center; margin:8px 0 12px; }
  .team-name { width:40%; font-size:14px; font-weight:800; line-height:1.3; user-select:text; }
  .team-name.away { text-align:right; }
  .score-display { background:rgba(15,23,42,0.9); border:1px solid var(--card-border); padding:6px 14px; border-radius:12px; font-family:'Orbitron',sans-serif; font-weight:900; font-size:13px; color:var(--neon-gold); }
  .prediction-panel { background:rgba(2,4,8,0.8); border:1px solid var(--card-border); border-radius:14px; padding:12px 14px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .pred-main { font-size:12px; font-weight:800; color:#fff; user-select:text; }
  .pred-sub { font-size:10px; color:var(--text-muted); margin-top:3px; line-height:1.4; }
  .odd-chip { background:rgba(255,183,3,0.12); border:1px solid var(--neon-gold); color:var(--neon-gold); padding:5px 11px; border-radius:10px; font-family:'Orbitron',sans-serif; font-weight:800; font-size:12px; flex-shrink:0; }
  .action-bar { display:flex; gap:6px; margin-top:10px; }
  .cyber-btn { flex:1; background:rgba(15,23,42,0.9); border:1px solid var(--card-border); color:var(--text-main); padding:9px 6px; border-radius:12px; font-size:11px; font-weight:700; cursor:pointer; }
  .cyber-btn:disabled { opacity:0.4; cursor:not-allowed; }
  .cyber-btn.accent { background:rgba(6,214,160,0.15); border-color:rgba(6,214,160,0.5); color:var(--neon-green); }
  .cyber-btn.copy-btn { flex:0.45; background:rgba(0,243,255,0.1); border-color:rgba(0,243,255,0.4); color:var(--neon-cyan); }
  .analytics-drawer { display:none; margin-top:12px; padding-top:12px; border-top:1px dashed var(--card-border); font-size:11px; }
  .matrix-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:10px; }
  .matrix-cell { background:rgba(15,23,42,0.8); padding:8px; border-radius:10px; text-align:center; border:1px solid var(--card-border); }
  .matrix-cell b { display:block; color:var(--neon-gold); font-family:'Orbitron',sans-serif; font-size:12px; margin-top:3px; }

  .exact-box { background:linear-gradient(135deg,rgba(0,243,255,0.08),rgba(2,4,8,0.92)); border:1px solid rgba(0,243,255,0.35); border-radius:12px; padding:10px; margin-bottom:10px; }
  .exact-header { display:flex; justify-content:space-between; align-items:center; font-family:'Orbitron',sans-serif; font-size:10px; font-weight:900; color:var(--neon-cyan); margin-bottom:8px; }
  .exact-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .exact-chip { background:rgba(15,23,42,0.85); border:1px solid var(--card-border); border-radius:10px; padding:7px 6px; text-align:center; }
  .exact-chip.primary { border-color:var(--neon-gold); background:rgba(255,183,3,0.1); }
  .exact-chip.hit { border-color:var(--neon-green); background:rgba(6,214,160,0.18); box-shadow:0 0 12px rgba(6,214,160,0.3); }
  .exact-score-val { font-family:'Orbitron',sans-serif; font-size:14px; font-weight:900; color:#fff; }
  .exact-chip.primary .exact-score-val { color:var(--neon-gold); }
  .exact-chip.hit .exact-score-val { color:var(--neon-green); }
  .exact-meta { font-size:9.5px; color:var(--text-muted); margin-top:3px; }
  .stats-box { background:rgba(2,4,8,0.72); border:1px solid var(--card-border); border-radius:10px; padding:9px 10px; line-height:1.65; }
  
  .joe-chat-box { background:rgba(2,4,8,0.9); border:1px solid var(--neon-cyan); border-radius:16px; padding:12px; margin-top:14px; }
  .chat-messages { height:220px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding-right:4px; margin-bottom:10px; scrollbar-width:thin; }
  .chat-msg { max-width:86%; padding:9px 12px; border-radius:12px; font-size:11.5px; line-height:1.45; word-break:break-word; }
  .chat-msg.joe { background:rgba(0,243,255,0.1); border:1px solid rgba(0,243,255,0.3); color:#fff; align-self:flex-start; border-top-left-radius:3px; }
  .chat-msg.user { background:rgba(6,214,160,0.15); border:1px solid rgba(6,214,160,0.4); color:var(--neon-green); align-self:flex-end; border-top-right-radius:3px; }
  .chat-form { display:flex; gap:6px; align-items:center; }
  .chat-file-btn { background:rgba(255,183,3,0.15); border:1px solid var(--neon-gold); color:var(--neon-gold); padding:9px 11px; border-radius:10px; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; position:relative; }
  .chat-file-btn.has-img { background:rgba(6,214,160,0.22); border-color:var(--neon-green); color:var(--neon-green); box-shadow:0 0 10px rgba(6,214,160,0.35); }
  .preview-thumb { width:100%; max-height:140px; object-fit:contain; border-radius:8px; margin-top:6px; border:1px solid var(--neon-cyan); background:#020408; }

  @keyframes ticketRowSlide {
    0% { opacity: 0; transform: translateY(12px) scale(0.97); border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0,243,255,0.3); }
    100% { opacity: 1; transform: translateY(0) scale(1); border-color: var(--card-border); box-shadow: none; }
  }
  .ticket-row-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px; background: rgba(15,23,42,0.8); border-radius: 10px;
    margin-bottom: 6px; border: 1px solid var(--card-border);
    opacity: 0;
    animation: ticketRowSlide 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes boomEffect {
    0% { transform: scale(1); box-shadow: 0 0 5px rgba(255,183,3,0.2); border-color: var(--card-border); }
    30% { transform: scale(1.02); box-shadow: 0 0 35px var(--neon-gold), inset 0 0 15px rgba(255,183,3,0.5); border-color: var(--neon-gold); }
    60% { transform: scale(0.99); box-shadow: 0 0 20px rgba(255,183,3,0.4); border-color: var(--neon-gold); }
    100% { transform: scale(1); box-shadow: 0 0 25px rgba(255,183,3,0.3); border-color: var(--neon-gold); }
  }
  .boom-active {
    animation: boomEffect 0.5s ease-in-out forwards;
    background: radial-gradient(circle at 50% 50%, rgba(255,183,3,0.15), rgba(10,15,28,0.95)) !important;
  }

  .vault-hero { background:linear-gradient(135deg,#0d1b2a,#020408); border:1.5px solid var(--neon-cyan); border-radius:22px; padding:20px; margin-bottom:14px; box-shadow:0 0 30px rgba(0,243,255,0.15); }
  .vault-profile { display:flex; align-items:center; gap:14px; margin-bottom:12px; }
  .joe-avatar-box { width:64px; height:64px; border-radius:18px; border:2px solid var(--neon-gold); overflow:hidden; display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 0 20px rgba(255,183,3,0.3); position:relative; }
  .joe-status-dot { position:absolute; bottom:2px; right:2px; width:12px; height:12px; background:var(--neon-green); border:2px solid #020408; border-radius:50%; z-index:2; }
  .vault-quote { font-style:italic; font-size:11.5px; color:var(--neon-cyan); background:rgba(0,243,255,0.06); padding:10px 14px; border-radius:12px; border-left:3px solid var(--neon-cyan); line-height:1.4; }
  
  .vault-kpi-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px; }
  .vault-kpi { background:rgba(2,4,8,0.6); border:1px solid var(--card-border); border-radius:12px; padding:10px; text-align:center; }
  .v-lbl { font-size:9px; color:var(--text-muted); text-transform:uppercase; font-family:'Orbitron',sans-serif; }
  .v-val { font-size:13px; font-family:'Orbitron',sans-serif; font-weight:900; margin-top:4px; }
  .cyber-progress { width:100%; height:10px; background:rgba(255,255,255,0.04); border-radius:99px; margin-top:14px; overflow:hidden; border:1px solid var(--card-border); }
  .cyber-progress-fill { height:100%; background:linear-gradient(90deg,var(--neon-green),var(--neon-cyan)); border-radius:99px; transition:0.4s; }
  .joe-pick-card { background:linear-gradient(145deg,rgba(6,214,160,0.12),rgba(2,4,8,0.95)); border:1.5px solid var(--neon-green); border-radius:18px; padding:16px; margin-bottom:14px; box-shadow:0 0 25px rgba(6,214,160,0.15); }
  .bet-ticket { background:var(--card-bg); border:1px solid var(--card-border); border-radius:16px; padding:14px; margin-bottom:10px; }
  .bet-ticket-actions { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .t-btn { flex:1; padding:7px; border-radius:10px; border:1px solid var(--card-border); font-size:11px; font-weight:800; cursor:pointer; background:rgba(15,23,42,0.9); color:#fff; min-width:65px; }
  .t-win { background:rgba(6,214,160,0.15); border-color:var(--neon-green); color:var(--neon-green); }
  .t-loss { background:rgba(239,71,111,0.15); border-color:var(--neon-red); color:var(--neon-red); }
  .t-edit { background:rgba(0,243,255,0.15); border-color:var(--neon-cyan); color:var(--neon-cyan); }
  .bottom-hud-nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:520px; height:72px; background:rgba(2,4,8,0.94); backdrop-filter:blur(22px); border-top:1px solid var(--card-border); display:flex; justify-content:space-around; align-items:center; z-index:30; }
  .hud-nav-item { display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--text-muted); font-size:9px; font-family:'Orbitron',sans-serif; font-weight:700; gap:4px; cursor:pointer; background:none; border:none; flex:1; height:100%; text-transform:uppercase; }
  .hud-nav-item .ico { font-size:20px; }
  .hud-nav-item.active { color:var(--neon-cyan); text-shadow:0 0 12px rgba(0,243,255,0.6); }
  .toast-msg { position:fixed; top:76px; left:50%; transform:translateX(-50%); background:rgba(6,214,160,0.95); color:#020408; padding:8px 18px; border-radius:12px; font-family:'Orbitron',sans-serif; font-size:11px; font-weight:900; z-index:300; display:none; box-shadow:0 0 20px rgba(6,214,160,0.6); }

  .toggle-container { display: flex; align-items: center; justify-content: space-between; background: rgba(2,4,8,0.7); padding: 10px 14px; border-radius: 12px; border: 1px solid var(--card-border); margin-bottom: 12px; transition: 0.3s; }
  .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #1e293b; transition: .3s; border-radius: 24px; border: 1px solid var(--card-border); }
  .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 2px; bottom: 2px; background-color: #fff; transition: .3s; border-radius: 50%; }
  input:checked + .slider { background-color: var(--neon-gold); }
  input:checked + .slider:before { transform: translateX(20px); background-color: #020408; }
</style>
</head>
<body>

<div class="toast-msg" id="toastMsg">✅ COPIAT ÎN CLIPBOARD!</div>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-logo">
      <img src="IMG_3705.jpeg" alt="Joe" style="width:100%; height:100%; object-fit:cover;">
    </div>
    <div style="font-family:'Orbitron',sans-serif;font-size:16px;font-weight:900;color:#fff;margin-bottom:4px;">JOE PREZICE</div>
    <div style="font-size:11px;color:var(--neon-cyan);margin-bottom:20px;font-family:'Orbitron',sans-serif;">SECURE NEURAL HUD · v9</div>
    <input type="text" id="loginUser" class="cyber-input" placeholder="Utilizator" autocomplete="username">
    <input type="password" id="loginPass" class="cyber-input" placeholder="Parolă" autocomplete="current-password" onkeydown="if(event.key==='Enter')attemptLogin()">
    <button class="login-btn" id="loginSubmitBtn" onclick="attemptLogin()">🔐 AUTENTIFICARE</button>
    <div id="loginErr" style="color:var(--neon-red);font-size:11px;font-weight:700;margin-top:12px;display:none;">Date de logare incorecte!</div>
    <div style="font-size:10px;color:var(--text-muted);margin-top:14px;line-height:1.5;">18+ · Pronosticurile nu garantează câștig. Joc responsabil: 0800 800 099.</div>
  </div>
</div>

<div class="app-shell">
  <div class="top-hud">
    <div class="hud-brand">
      <div class="hud-logo">
        <img src="IMG_3705.jpeg" alt="Joe" style="width:100%; height:100%; object-fit:cover;">
      </div>
      <div>
        <span class="hud-title" id="hudAppTitle">JOE PREZICE</span>
        <span class="hud-status" id="liveClock">● Live 24/7</span>
      </div>

    <div class="hud-right">

      <button class="refresh-btn" onclick="refreshLiveData()" title="Actualizează scoruri și cote LIVE">🔄</button>
      <button class="logout-btn" onclick="logoutUser()" title="Deconectare">🚪</button>
    </div>
  </div>
  
  <div class="sub-bars" id="subBars">
    <div class="h-scroll" id="dateBar"></div>
    <div class="h-scroll" id="leagueBar" style="margin-top:6px;"></div>
  </div>

  <div class="search-container" id="searchContainer">
    <input type="text" id="matchSearchInput" class="search-input" placeholder="🔍 Caută echipă sau națională (ex: Romania, Spania, Real)..." oninput="renderViewport()">
  </div>

  <div style="font-size:9px;color:var(--text-muted);text-align:center;padding:4px 10px;background:rgba(5,9,18,0.6);">18+ · Pronosticurile nu garantează câștig. Joc responsabil: 0800 800 099.</div>

  <div class="viewport" id="viewport"></div>

  <nav class="bottom-hud-nav">
    <button class="hud-nav-item active" id="nav-meciuri" onclick="switchNav('meciuri')"><span class="ico">⚽</span><span>Meciuri</span></button>
    <button class="hud-nav-item" id="nav-europa" onclick="switchNav('europa')"><span class="ico">🏆</span><span>Europa</span></button>

function pruneOldStorage() {

      if (k.startsWith("joe_cache_") && !k.startsWith("joe_cache_v9_")) localStorage.removeItem(k);

        const dStr = k.replace("joe_cache_v9_", "");
        if (dStr < cutoff) localStorage.removeItem(k);
      }
      if (k.startsWith("joe_locked_preds_") && k !== LOCKED_PREDS_KEY) localStorage.removeItem(k);
    });
    const lp = getLockedPreds();
    let changed = false;
    Object.keys(lp).forEach(id => {

}

function calculateExpiresAt(duration) {
  const now = new Date();
  if (duration === 'trial') now.setDate(now.getDate() + 2);
  else if (duration === '1_month') now.setMonth(now.getMonth() + 1);
  else if (duration === '3_months') now.setMonth(now.getMonth() + 3);
  else if (duration === '6_months') now.setMonth(now.getMonth() + 6);
  else if (duration === '1_year') now.setFullYear(now.getFullYear() + 1);
  else now.setMonth(now.getMonth() + 1);
  return now.toISOString();
}

function formatExpiryDate(isoStr) {
  if (!isoStr) return "Permanent / Nelimitat";
  return new Date(isoStr).toLocaleDateString("ro-RO", { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
}

function poissonPmf(k, lam) {
  let f = 1; for (let i = 2; i <= k; i++) f *= i;
  return Math.exp(-lam) * Math.pow(lam, k) / f;
}

function poissonOverProb(line, lam) {
  const minK = Math.floor(line) + 1; let cdf = 0;
  for (let k = 0; k < minK; k++) cdf += poissonPmf(k, lam);
  return Math.max(0.05, Math.min(0.95, 1 - cdf));
}

function dixonColesTau(h, a, lamH, lamA, rho = -0.09) {
  if (h === 0 && a === 0) return Math.max(0.5, 1 - lamH * lamA * rho);
  if (h === 0 && a === 1) return Math.max(0.5, 1 + lamH * rho);
  if (h === 1 && a === 0) return Math.max(0.5, 1 + lamA * rho);
  if (h === 1 && a === 1) return Math.max(0.5, 1 - rho);
  return 1.0;
}

function calcRealisticOdd(p, realOdd = null, mk = "GOALS") {
  if (realOdd && realOdd >= 1.02) return +realOdd.toFixed(2);
  const prob = Math.max(0.015, Math.min(0.96, p));
  const fairProfit = (1 / prob) - 1;
  let retention;
  if (prob <= 0.62) {
    retention = 0.85;
  } else {
    const excess = (prob - 0.62) / 0.30;
    retention = Math.max(0.42, 0.85 - Math.pow(excess, 1.35) * 0.43);
  }
  if (mk === "COMBO_DC" || mk === "COMBO_SOLO" || mk === "COMBO_U35") retention *= 0.96;
  else if (mk === "EXACT") retention = 0.80;
  return Math.max(1.02, +(1 + fairProfit * retention).toFixed(2));
}

// Extragere strictă a cotelor reale (fără cote inventate marcate ca „piață” și doar linii x.5 la O/U)
function extractMarketOdds(comp) {
  if (!comp.odds || !Array.isArray(comp.odds) || comp.odds.length === 0) return null;
  const oddObj = comp.odds.find(o => o && (o.homeTeamOdds || o.overUnder)) || comp.odds[0];
  if (!oddObj) return null;
  const mlToDec = (ml) => {
    const n = parseFloat(ml);
    if (isNaN(n) || n === 0) return null;
    if (n > 1.02 && n < 25.0) return n;
    if (Math.abs(n) < 100) return null;
    const dec = n > 0 ? 1 + (n / 100) : 1 + (100 / Math.abs(n));
    return (dec >= 1.03 && dec <= 35.0) ? dec : null;
  };
  let mktPH = null, mktPD = null, mktPA = null, decH = null, decD = null, decA = null, dec1X = null, decX2 = null;
  let hasRealDraw = false;
  if (oddObj.homeTeamOdds && oddObj.awayTeamOdds) {
    decH = mlToDec(oddObj.homeTeamOdds.moneyLine);
    decA = mlToDec(oddObj.awayTeamOdds.moneyLine);
    decD = oddObj.drawOdds ? mlToDec(oddObj.drawOdds.moneyLine) : null;
    hasRealDraw = !!decD;
    if (decH && decA) {
      const gap = Math.abs(1 / decH - 1 / decA);
      const dynamicDrawOdd = Math.min(6.80, Math.max(3.15, 3.25 + gap * 3.8));
      const effD = decD || dynamicDrawOdd;
      const invH = 1 / decH, invD = 1 / effD, invA = 1 / decA, overround = invH + invD + invA;
      mktPH = invH / overround; mktPD = invD / overround; mktPA = invA / overround;
      // 1X și X2 sunt marcate ca „cotă piață” EXCLUSIV dacă ESPN a oferit cota reală de egal
      if (hasRealDraw) {
        dec1X = Math.max(1.02, +(((decH * decD) / (decH + decD)) * 0.992).toFixed(2));
        decX2 = Math.max(1.02, +(((decA * decD) / (decA + decD)) * 0.992).toFixed(2));
      }
    }
  }
  const rawOU = oddObj.overUnder ? parseFloat(oddObj.overUnder) : null;
  const ouIsHalf = rawOU !== null && !isNaN(rawOU) && Math.abs((rawOU % 1) - 0.5) < 0.01;
  const ouLine = ouIsHalf ? rawOU : null;
  const decOver = (ouIsHalf && oddObj.overOdds) ? mlToDec(oddObj.overOdds) : null;
  const decUnder = (ouIsHalf && oddObj.underOdds) ? mlToDec(oddObj.underOdds) : null;
  let mktPOver = null;
  if (ouIsHalf && decOver && decUnder) {
    const invO = 1 / decOver, invU = 1 / decUnder;
    mktPOver = invO / (invO + invU);
  }
  return { mktPH, mktPD, mktPA, decH, decD, decA, hasRealDraw, dec1X, decX2, ouLine, decOver, decUnder, mktPOver };
}

// Reconstrucție scor la pauză + scor strict la 90 de minute (exclude prelungirile AET și penalty-urile)
function extractScoresDetails(comp, home, away, curStatus) {
  const sc = c => c.score !== undefined ? parseInt(c.score, 10) : null;
  const hSc = sc(home), aSc = sc(away);
  const stObj = (comp.status && comp.status.type) || {};
  const stText = `${stObj.shortDetail || ""} ${stObj.name || ""} ${stObj.description || ""}`.toUpperCase();
  const isAET = /\b(AET|FT-PENS|PENS|PENALTIES|EXTRA)\b/.test(stText);

  let hScore90 = hSc, aScore90 = aSc, score90Valid = !isAET;
  let hHT = (home.linescores && home.linescores.length && home.linescores[0].value !== undefined) ? parseInt(home.linescores[0].value, 10) : null;
  let aHT = (away.linescores && away.linescores.length && away.linescores[0].value !== undefined) ? parseInt(away.linescores[0].value, 10) : null;
  if (isNaN(hHT) || isNaN(aHT)) { hHT = null; aHT = null; }

  if (curStatus === "FT" && hSc === 0 && aSc === 0) {
    hHT = 0; aHT = 0;
  }

  if (curStatus === "FT" && Array.isArray(comp.details) && hSc !== null && aSc !== null) {
    const goals = comp.details.filter(d => d && d.scoringPlay && !d.shootout);
    const hId = String(home.team && home.team.id || "");
    const aId = String(away.team && away.team.id || "");
    if (goals.length === hSc + aSc) {
      let ghHT = 0, gaHT = 0, gh90 = 0, ga90 = 0;
      goals.forEach(g => {
        const rawClock = String(g.clock && g.clock.displayValue || "");
        const min = parseInt(rawClock, 10);
        const tid = String(g.team && g.team.id || "");
        if (!isNaN(min)) {
          if (min <= 45) {
            if (tid === hId) ghHT++; else if (tid === aId) gaHT++;
          }
          if (min <= 90) {
            if (tid === hId) gh90++; else if (tid === aId) ga90++;
          }
        }
      });
      if (hHT === null || aHT === null) { hHT = ghHT; aHT = gaHT; }
      if (isAET) { hScore90 = gh90; aScore90 = ga90; score90Valid = true; }
    } else if (isAET) {
      // Meci cu prelungiri fără detalii clare de goluri: nu validăm greșit pe 120 min
      hScore90 = null; aScore90 = null; score90Valid = false;
    }
  } else if (isAET) {
    hScore90 = null; aScore90 = null; score90Valid = false;
  }

  return { hSc, aSc, hScore90, aScore90, isAET, score90Valid, hHT, aHT };
}

function extractRealTeamProfile(compObj, isHome, teamName, slug) {
  const baseP = power(teamName, slug);
  let recScore = null, venueScore = null, formScore = null, drawRatio = 0.25;

  if (compObj.records && Array.isArray(compObj.records)) {
    const parseRec = (rec) => {
      if (!rec || !rec.summary) return null;
      const parts = rec.summary.split("-").map(x => parseInt(x, 10));
      if (parts.length === 3 && !isNaN(parts[0])) {
        const [w, d, l] = parts, tot = w + d + l;
        if (tot > 0) return { w, d, l, tot, ppg: (w * 3 + d) / tot };
      }
      return null;
    };
    const totalRec = parseRec(compObj.records.find(r => r.type === "total") || compObj.records[0]);
    const venueRec = parseRec(compObj.records.find(r => r.type === (isHome ? "home" : "road") || (r.name && r.name.toLowerCase() === (isHome ? "home" : "away"))));
    if (totalRec) {
      const rel = Math.min(1.0, totalRec.tot / (totalRec.tot + 5));
      recScore = (totalRec.ppg - 1.36) * 0.42 * rel;
      drawRatio = (totalRec.d / totalRec.tot) * rel + 0.25 * (1 - rel);
    }
    if (venueRec && venueRec.tot >= 2) {
      const vRel = Math.min(1.0, venueRec.tot / (venueRec.tot + 4));
      venueScore = (venueRec.ppg - (isHome ? 1.52 : 1.18)) * 0.36 * vRel;
    }
  }

  if (compObj.form && typeof compObj.form === "string") {
    const raw = compObj.form.toUpperCase().replace(/[^WDL]/g, "").slice(-5);
    if (raw.length >= 3) {
      const weights = [0.65, 0.80, 1.0, 1.18, 1.35];
      let fs = 0, dCount = 0;
      for (let i = 0; i < raw.length; i++) {
        const ch = raw[i], w = weights[i + (5 - raw.length)] || 1.0;
        if (ch === "W") fs += 0.055 * w;
        else if (ch === "L") fs -= 0.055 * w;
        else dCount++;
      }
      formScore = fs;
      drawRatio = drawRatio * 0.7 + (dCount / raw.length) * 0.3;
    }
  }

  const hasStats = recScore !== null || formScore !== null;
  let empirical = 0;
  if (recScore !== null && venueScore !== null) empirical = recScore * 0.65 + venueScore * 0.35;
  else if (recScore !== null) empirical = recScore;
  if (formScore !== null) empirical = recScore !== null ? (empirical * 0.68 + formScore * 0.32) : formScore;

  const isIntl = slug === "uefa.nations" || slug.startsWith("fifa.");
  let finalPower = 0;
  if (baseP !== null && hasStats) {
    finalPower = isIntl ? (baseP * 0.75 + empirical * 0.25) : (baseP * 0.55 + empirical * 0.45);
  } else if (baseP !== null) {
    finalPower = baseP;
  } else if (hasStats) {
    finalPower = empirical;
  }

  const summaryStr = [(compObj.records && compObj.records[0] && compObj.records[0].summary) || "", compObj.form || ""].filter(Boolean).join(" · ") || (baseP !== null ? "Rating club" : "—");

  return {
    power: Math.max(-0.55, Math.min(0.65, finalPower)),
    drawRatio: Math.max(0.14, Math.min(0.38, drawRatio)),
    hasData: baseP !== null || hasStats,
    formLabel: summaryStr
  };
}

function fastProbs(lH, lA, rho) {
  const ph = [], pa = []; let f = 1;
  for (let k = 0; k < 10; k++) { if (k > 1) f *= k; ph[k] = Math.exp(-lH) * Math.pow(lH, k) / f; pa[k] = Math.exp(-lA) * Math.pow(lA, k) / f; }
  let s = 0, H = 0, D = 0, A = 0, o15 = 0, o25 = 0, o35 = 0, o45 = 0;
  for (let h = 0; h < 10; h++) for (let a = 0; a < 10; a++) {
    const p = ph[h] * pa[a] * dixonColesTau(h, a, lH, lA, rho), t = h + a; s += p;
    if (h > a) H += p; else if (h === a) D += p; else A += p;
    if (t >= 2) o15 += p; if (t >= 3) o25 += p; if (t >= 4) o35 += p; if (t >= 5) o45 += p;
  }
  return { H: H/s, D: D/s, A: A/s, o15: o15/s, o25: o25/s, o35: o35/s, o45: o45/s };
}

function probsGrid(lH, lA, rho) {
  const ph = [], pa = []; let f = 1;
  for (let k = 0; k < 10; k++) { if (k > 1) f *= k; ph[k] = Math.exp(-lH) * Math.pow(lH, k) / f; pa[k] = Math.exp(-lA) * Math.pow(lA, k) / f; }
  let s = 0, H = 0, D = 0, A = 0, o15 = 0, o25 = 0, o35 = 0, gg = 0;
  let dc1X_o15 = 0, dcX2_o15 = 0, dc1X_u35 = 0, dcX2_u35 = 0;
  let h_o15 = 0, a_o15 = 0, h_o25 = 0, a_o25 = 0, h_o35 = 0, a_o35 = 0;
  let hScores = 0, aScores = 0, h2Plus = 0, a2Plus = 0;
  const cells = [];

  for (let h = 0; h < 10; h++) for (let a = 0; a < 10; a++) {
    const p = ph[h] * pa[a] * dixonColesTau(h, a, lH, lA, rho), t = h + a; s += p;
    if (h <= 6 && a <= 6) cells.push({ h, a, p });
    if (h > a) H += p; else if (h === a) D += p; else A += p;
    if (h >= 1) hScores += p; if (a >= 1) aScores += p;
    if (h >= 2) h2Plus += p; if (a >= 2) a2Plus += p;
    if (t >= 2) o15 += p; if (t >= 3) o25 += p; if (t >= 4) o35 += p; if (h && a) gg += p;
    if (h >= a && t >= 2) dc1X_o15 += p;
    if (a >= h && t >= 2) dcX2_o15 += p;
    if (h >= a && t <= 3) dc1X_u35 += p;
    if (a >= h && t <= 3) dcX2_u35 += p;
    if (h > a && t >= 2) h_o15 += p;
    if (a > h && t >= 2) a_o15 += p;
    if (h > a && t >= 3) h_o25 += p;
    if (a > h && t >= 3) a_o25 += p;
    if (h > a && t >= 4) h_o35 += p;
    if (a > h && t >= 4) a_o35 += p;
  }

  cells.sort((x, y) => y.p - x.p);
  const topScores = cells.slice(0, 3).map(x => {
    const pr = x.p / s;
    return { score: `${x.h}-${x.a}`, h: x.h, a: x.a, prob: +(pr * 100).toFixed(1), odd: calcRealisticOdd(pr, null, "EXACT") };
  });

  const Hn = H/s, Dn = D/s, An = A/s;
  const lH1 = lH * 0.45, lA1 = lA * 0.45, lH2 = lH * 0.55, lA2 = lA * 0.55;
  let ht1_notFT1 = 0, ht2_notFT2 = 0;
  for (let h1 = 0; h1 <= 4; h1++) for (let a1 = 0; a1 <= 4; a1++) {
    if (h1 === a1) continue;
    const p1 = poissonPmf(h1, lH1) * poissonPmf(a1, lA1);
    for (let h2 = 0; h2 <= 4; h2++) for (let a2 = 0; a2 <= 4; a2++) {
      const p2 = poissonPmf(h2, lH2) * poissonPmf(a2, lA2);
      if (h1 > a1 && (h1 + h2) <= (a1 + a2)) ht1_notFT1 += p1 * p2;
      if (a1 > h1 && (a1 + a2) <= (h1 + h2)) ht2_notFT2 += p1 * p2;
    }
  }

  return {
    H: Hn, D: Dn, A: An, o15: o15/s, o25: o25/s, o35: o35/s, u35: 1 - o35/s, gg: gg/s,
    dc1X_o15: dc1X_o15/s, dcX2_o15: dcX2_o15/s, dc1X_u35: dc1X_u35/s, dcX2_u35: dcX2_u35/s,
    h_o15: h_o15/s, a_o15: a_o15/s, h_o25: h_o25/s, a_o25: a_o25/s, h_o35: h_o35/s, a_o35: a_o35/s,
    hScores: hScores/s, aScores: aScores/s, h2Plus: h2Plus/s, a2Plus: a2Plus/s,
    psf1: Math.min(0.94, Hn + ht1_notFT1), psf2: Math.min(0.94, An + ht2_notFT2),
    topScores
  };
}

// Optimizare în 2 trepte (rapidă și precisă) pe interval extins (T: 1.50–5.25, sh: 0.05–0.95) și strict linii x.5
function fitToMarket(mH, mD, mA, tPrior, w, rho, ouLine = null, mktPOver = null) {
  const evalErr = (T, sh) => {
    const g = fastProbs(T * sh, T * (1 - sh), rho);
    let e = (g.H - mH) ** 2 + (mD == null ? 0 : (g.D - mD) ** 2 * 0.65) + (g.A - mA) ** 2 + w * (T - tPrior) ** 2;
    if (mktPOver !== null && ouLine !== null) {
      let gOver = null;
      if (Math.abs(ouLine - 1.5) < 0.01) gOver = g.o15;
      else if (Math.abs(ouLine - 2.5) < 0.01) gOver = g.o25;
      else if (Math.abs(ouLine - 3.5) < 0.01) gOver = g.o35;
      else if (Math.abs(ouLine - 4.5) < 0.01) gOver = g.o45;
      if (gOver !== null) e += (gOver - mktPOver) ** 2 * 1.25;
    }
    return e;
  };

  let best = { e: Infinity, T: tPrior, sh: 0.5 };
  for (let T = 1.50; T <= 5.25; T += 0.15) {
    for (let sh = 0.05; sh <= 0.95; sh += 0.03) {
      const e = evalErr(T, sh);
      if (e < best.e) best = { e, T, sh };
    }
  }
  const tMin = Math.max(1.45, best.T - 0.18), tMax = Math.min(5.30, best.T + 0.18);
  const sMin = Math.max(0.04, best.sh - 0.04), sMax = Math.min(0.96, best.sh + 0.04);
  for (let T = tMin; T <= tMax; T += 0.025) {
    for (let sh = sMin; sh <= sMax; sh += 0.005) {
      const e = evalErr(T, sh);
      if (e < best.e) best = { e, T, sh };
    }
  }
  return { e: best.e, lH: best.T * best.sh, lA: best.T * (1 - best.sh) };
}

function analyzeMatch(ev, lg) {

  const teamExpectedT = Math.max(2.00, Math.min(4.10, gBase + paceMod));
  const modelShare = Math.min(0.86, Math.max(0.14, 1 / (1 + Math.exp(-(0.16 + diff * 1.95)))));

  if (hasMkt) {
    // Calibrare pură pe cotele pieței (fără amestec artificial de 10% cu tabelul static)
    const maxFavP = Math.max(mkt.mktPH, mkt.mktPA);
    const mktImpliedT = gBase + Math.max(0, maxFavP - 0.55) * 2.85;
    const poissonAdjLine = mkt.ouLine ? mkt.ouLine + 0.17 : null;
    const tp = (poissonAdjLine >= 1.6 && poissonAdjLine <= 4.7) ? poissonAdjLine : Math.min(4.85, mktImpliedT);
    const f = fitToMarket(mkt.mktPH, mkt.hasRealDraw ? mkt.mktPD : null, mkt.mktPA, tp, mkt.mktPOver ? 0.015 : (mkt.ouLine ? 0.04 : 0.03), rho, mkt.ouLine, mkt.mktPOver);
    lH = f.lH;
    lA = f.lA;
    g = probsGrid(lH, lA, rho);
    src = "market";
  } else {
    lH = teamExpectedT * modelShare;
    lA = teamExpectedT * (1 - modelShare);
    g = probsGrid(lH, lA, rho);
  }

  const T = lH + lA;
  const winDiff = g.H - g.A;

  const c = [];
  const add = (name, mk, p, realOdd = null) => {
    const bookieOdd = calcRealisticOdd(p, realOdd, mk);
    const fairOdd = +(1 / Math.max(0.10, p)).toFixed(2);
    c.push({ name, mk, p, odd: bookieOdd, fairOdd, real: !!(realOdd && realOdd >= 1.02) });
  };

  if (winDiff >= 0.12) add(`1 (${hName})`, "SOLO", g.H, hasMkt ? mkt.decH : null);
  if (winDiff <= -0.12) add(`2 (${aName})`, "SOLO", g.A, hasMkt ? mkt.decA : null);
  if (winDiff >= -0.02) add("Șansă Dublă 1X", "DC", g.H + g.D, (hasMkt && mkt.hasRealDraw) ? mkt.dec1X : null);
  if (winDiff <= 0.02) add("Șansă Dublă X2", "DC", g.A + g.D, (hasMkt && mkt.hasRealDraw) ? mkt.decX2 : null);
  if (winDiff >= 0.10 && g.H >= 0.48 && g.H <= 0.64) add(`PSF 1 (${hName})`, "PSF", g.psf1, null);
  if (winDiff <= -0.10 && g.A >= 0.48 && g.A <= 0.64) add(`PSF 2 (${aName})`, "PSF", g.psf2, null);
  if (T >= 2.40) add("Peste 1.5 Goluri", "O15", g.o15, (hasMkt && mkt.ouLine === 1.5) ? mkt.decOver : null);
  if (T >= 2.65) add("Peste 2.5 Goluri", "O25", g.o25, (hasMkt && mkt.ouLine === 2.5) ? mkt.decOver : null);
  if (T >= 3.45) add("Peste 3.5 Goluri", "O35", g.o35, (hasMkt && mkt.ouLine === 3.5) ? mkt.decOver : null);
  if (T <= 2.40) add("Sub 2.5 Goluri", "U25", 1 - g.o25, (hasMkt && mkt.ouLine === 2.5) ? mkt.decUnder : null);
  if (T <= 2.65) add("Sub 3.5 Goluri", "U35", g.u35, (hasMkt && mkt.ouLine === 3.5) ? mkt.decUnder : null);
  if (lH >= 0.95 && lA >= 0.95 && T >= 2.55) add("GG (Ambele marchează)", "GG", g.gg, null);
  if (winDiff >= 0.12 && T >= 2.38) add("1X & Peste 1.5 Goluri", "COMBO_DC", g.dc1X_o15, null);
  if (winDiff <= -0.12 && T >= 2.38) add("X2 & Peste 1.5 Goluri", "COMBO_DC", g.dcX2_o15, null);
  if (winDiff >= 0.24 && T >= 2.55) add("1 & Peste 1.5 Goluri", "COMBO_SOLO", g.h_o15, null);
  if (winDiff <= -0.24 && T >= 2.55) add("2 & Peste 1.5 Goluri", "COMBO_SOLO", g.a_o15, null);
  if (winDiff >= 0.35 && T >= 2.90) add("1 & Peste 2.5 Goluri", "COMBO_SOLO", g.h_o25, null);
  if (winDiff <= -0.35 && T >= 2.90) add("2 & Peste 2.5 Goluri", "COMBO_SOLO", g.a_o25, null);
  if (winDiff >= 0.55 && T >= 3.50) add("1 & Peste 3.5 Goluri", "COMBO_SOLO", g.h_o35, null);
  if (winDiff <= -0.55 && T >= 3.50) add("2 & Peste 3.5 Goluri", "COMBO_SOLO", g.a_o35, null);
  if (winDiff >= 0.08 && T <= 2.62) add("1X & Sub 3.5 Goluri", "COMBO_U35", g.dc1X_u35, null);
  if (winDiff <= -0.08 && T <= 2.62) add("X2 & Sub 3.5 Goluri", "COMBO_U35", g.dcX2_u35, null);
  if (lH >= 1.38 && winDiff >= 0.05) add(`Gazdele marchează 1+ (${hName})`, "TEAM_G", g.hScores, null);
  if (lA >= 1.38 && winDiff <= -0.05) add(`Oaspeții marchează 1+ (${aName})`, "TEAM_G", g.aScores, null);
  if (lH >= 2.05 && winDiff >= 0.30) add(`Gazdele marchează 2+ (${hName})`, "TEAM_G2", g.h2Plus, null);
  if (lA >= 2.05 && winDiff <= -0.30) add(`Oaspeții marchează 2+ (${aName})`, "TEAM_G2", g.a2Plus, null);

  // Selecție curată: cea mai mare probabilitate cu cotă minimă 1.22 (fără bias spre 1.45, fără plafon 79%, fără bonusuri arbitrare)
  let pool = c.filter(x => x.odd >= 1.22 && x.odd <= 2.35 && x.p >= 0.50);
  if (!pool.length) pool = c.filter(x => x.odd >= 1.18 && x.odd <= 2.60);
  if (!pool.length) pool = c;
  pool.sort((a, b) => (b.p - a.p) || (b.real ? 1 : 0) - (a.real ? 1 : 0));
  const best = pool[0];

  // Selecție Challenge: exclusiv piețe cu model real (fără cornere/cartonașe), cotă @1.20–@1.36, probabilitate maximă
  const chalPool = c.filter(x => x.odd >= 1.20 && x.odd <= 1.36 && x.p >= 0.65);
  chalPool.sort((a, b) => (b.p - a.p));
  const chalBest = chalPool[0] || best;

  const matchObj = {
    ver: MODEL_VERSION,
    id: String(ev.id), slug: lg.slug, league: lg.name, icon: lg.icon, cat: lg.cat,
    date: roDateStr(dt), time: roTimeStr(dt), status: curStatus,
    home: hName, away: aName,
    hScore: hSc, aScore: aSc, hScore90, aScore90, isAET, score90Valid, hHT, aHT,
    hForm: hProf.formLabel, aForm: aProf.formLabel, lamH: lH.toFixed(2), lamA: lA.toFixed(2),
    isDerby, lowData, src, hasMktOdds: hasMkt,
    pick: best.name, mktType: best.mk, prob: Math.round(best.p * 100), odd: best.odd, fairOdd: best.fairOdd, oddReal: best.real,
    chalPick: chalBest.name, chalProb: Math.round(chalBest.p * 100), chalOdd: chalBest.odd, chalReal: chalBest.real,
    tipsterScore: best.p * (src === "market" ? 1.0 : (lowData ? 0.65 : 0.88)),
    actualCorners: (hc !== null && ac !== null) ? hc + ac : null,
    actualCards: (hy !== null && ay !== null) ? hy + ay + hr + ar : null,
    topScores: g.topScores,
    probs: { p1: Math.round(g.H*100), pX: Math.round(g.D*100), p2: Math.round(g.A*100), o25: Math.round(g.o25*100), gg: Math.round(g.gg*100), o15: Math.round(g.o15*100) }
  };

  if (curStatus === "NS" || hasMkt || !locked) {
    lockedMap[String(ev.id)] = matchObj;
    saveLockedPreds();
  }
  return matchObj;
}

// Validare strict pe scorul de 90 de minute
function checkBetOutcome(pick, h, a, hHT = null, aHT = null, score90Valid = true) {
  if (!pick || h == null || a == null || !score90Valid) return null;
  const t = h + a;

  if (pick.startsWith("Gazdele marchează 2+")) return h >= 2;
  if (pick.startsWith("Oaspeții marchează 2+")) return a >= 2;
  if (pick.startsWith("Gazdele marchează 1+")) return h >= 1;
  if (pick.startsWith("Oaspeții marchează 1+")) return a >= 1;
  if (pick === "1 & Peste 3.5 Goluri") return h > a && t >= 4;
  if (pick === "2 & Peste 3.5 Goluri") return a > h && t >= 4;
  if (pick === "1 & Peste 2.5 Goluri") return h > a && t >= 3;
  if (pick === "2 & Peste 2.5 Goluri") return a > h && t >= 3;
  if (pick === "1 & Peste 1.5 Goluri") return h > a && t >= 2;
  if (pick === "2 & Peste 1.5 Goluri") return a > h && t >= 2;
  if (pick.includes("1X & Peste 1.5")) return h >= a && t >= 2;
  if (pick.includes("X2 & Peste 1.5")) return a >= h && t >= 2;
  if (pick.includes("1X & Sub 3.5")) return h >= a && t <= 3;
  if (pick.includes("X2 & Sub 3.5")) return a >= h && t <= 3;
  if (pick.startsWith("PSF 1")) return h > a ? true : (hHT !== null && aHT !== null ? hHT > aHT : null);
  if (pick.startsWith("PSF 2")) return a > h ? true : (hHT !== null && aHT !== null ? aHT > hHT : null);
  if (pick.startsWith("1 (")) return h > a;
  if (pick.startsWith("2 (")) return a > h;
  if (pick.includes("Peste 3.5")) return t >= 4;
  if (pick === "Sub 3.5 Goluri") return t <= 3;
  if (pick.includes("Peste 2.5")) return t >= 3;
  if (pick.includes("Sub 2.5")) return t <= 2;
  if (pick.includes("Peste 1.5")) return t >= 2;
  if (pick.includes("GG")) return h > 0 && a > 0;
  if (pick.includes("1X")) return h >= a;
  if (pick.includes("X2")) return a >= h;
  return null;
}

// Miză strict pe trepte de probabilitate (fără Kelly / pseudo-edge)
function calculateSmartStake(bankroll, m) {
  let pct = 0.02;
  if (m.prob >= 72) pct = 0.04;
  else if (m.prob >= 64) pct = 0.03;
  else pct = 0.02;
  if (m.lowData) pct = 0.02;
  return { stake: Math.max(10, Math.round((bankroll * pct) / 5) * 5), pct: Math.round(pct * 100) };
}

// Generator Bilet: exclude lowData, prioritizează NS pe ziua curentă/viitoare și potrivește precis cota țintă
function buildOptimalTicket(pool, targetOdd) {
  const target = cota500Mode ? 500 : targetOdd, maxLegs = cota500Mode ? 15 : 11;
  const todayIso = roDateStr(new Date());
  const cleanPool = (pool || []).filter(m => !m.lowData);
  const candidates = (selectedDate >= todayIso) ? cleanPool.filter(m => m.status === "NS") : cleanPool;
  const remaining = [...candidates].sort((a, b) => b.tipsterScore - a.tipsterScore);

  const picks = []; let tot = 1;
  while (remaining.length && picks.length < maxLegs) {
    if (tot >= target * 0.92) break;
    const needed = target / tot;
    let chosenIdx = 0;
    // Dacă mai avem nevoie de un singur meci (cotă <= 2.40), alegem cel mai bun meci care nu sare agresiv peste țintă
    if (needed <= 2.35 && picks.length >= 1) {
      let bestScore = Infinity;
      const searchLimit = Math.min(remaining.length, 14);
      for (let i = 0; i < searchLimit; i++) {
        const diff = Math.abs(tot * remaining[i].odd - target);
        const score = diff - (remaining[i].prob / 100) * 0.25;
        if (score < bestScore) { bestScore = score; chosenIdx = i; }
      }
    }
    const m = remaining.splice(chosenIdx, 1)[0];
    if (picks.length > 0 && Math.abs(tot * m.odd - target) > Math.abs(tot - target) && tot >= target * 0.85) break;
    picks.push({
      home: m.home, away: m.away, pick: m.pick, odd: m.odd, prob: m.prob,
      status: m.status, hScore: m.hScore90, aScore: m.aScore90, isAET: m.isAET,
      score90Valid: m.score90Valid, hHT: m.hHT, aHT: m.aHT
    });
    tot *= m.odd;
  }
  return { picks, totalOdd: tot };
}

function parseRealSummaryStats(data, m) {
  let referee = null, actualCorners = m.actualCorners, actualCards = m.actualCards, shots = null, possession = null;
  let cornerPred = null, cardPred = null;

  if (data && data.gameInfo && Array.isArray(data.gameInfo.officials) && data.gameInfo.officials.length) {
    referee = data.gameInfo.officials[0].fullName || data.gameInfo.officials[0].displayName || null;
  }

  // Extragem statistici LIVE / FT reale din boxscore
  if (data && data.boxscore && Array.isArray(data.boxscore.teams) && data.boxscore.teams.length >= 2) {
    const teams = data.boxscore.teams;
    const getSt = (t, names) => {
      const list = t.statistics || [];
      for (const n of names) {
        const f = list.find(s => s.name === n || s.abbreviation === n || (s.label && s.label.toLowerCase().includes(n.toLowerCase())));
        if (f && f.displayValue !== undefined) {
          const v = parseFloat(f.displayValue);
          if (!isNaN(v)) return v;
        }
      }
      return null;
    };
    const hc = getSt(teams[0], ["wonCorners","cornerKicks","corners"]);
    const ac = getSt(teams[1], ["wonCorners","cornerKicks","corners"]);
    if (hc !== null && ac !== null) actualCorners = hc + ac;

    const hy = getSt(teams[0], ["yellowCards"]), ay = getSt(teams[1], ["yellowCards"]);
    const hr = getSt(teams[0], ["redCards"]) || 0, ar = getSt(teams[1], ["redCards"]) || 0;
    if (hy !== null && ay !== null) actualCards = hy + ay + hr + ar;

    const hs = getSt(teams[0], ["shotsOnTarget"]), as = getSt(teams[1], ["shotsOnTarget"]);
    if (hs !== null && as !== null) shots = `${hs} - ${as}`;

    const hp = getSt(teams[0], ["possessionPct"]), ap = getSt(teams[1], ["possessionPct"]);
    if (hp !== null && ap !== null) possession = `${hp}% - ${ap}%`;
  }

  // Verificăm dacă ESPN furnizează medii REALE pre-meci pe echipe (nu inventăm niciodată din medii de ligă!)
  if (data && data.boxscore && Array.isArray(data.boxscore.form) && data.boxscore.form.length >= 2) {
    // Dacă în viitor ESPN include statistici de cornere/cartonașe per meci în ultimele 5 partide, le calculăm strict dacă avem >= 3 meciuri reale per echipă
    const extractAvgFromEvents = (formEntry, fieldNames) => {
      const evs = (formEntry && formEntry.events) || [];
      const vals = [];
      evs.forEach(ev => {
        const st = ev.statistics || [];
        for (const n of fieldNames) {
          const f = st.find(x => x.name === n || x.abbreviation === n);
          if (f && !isNaN(parseFloat(f.displayValue))) { vals.push(parseFloat(f.displayValue)); break; }
        }
      });
      return vals.length >= 3 ? (vals.reduce((a, b) => a + b, 0) / vals.length) : null;
    };
    const hCornAvg = extractAvgFromEvents(data.boxscore.form[0], ["wonCorners","cornerKicks","corners"]);
    const aCornAvg = extractAvgFromEvents(data.boxscore.form[1], ["wonCorners","cornerKicks","corners"]);
    if (hCornAvg !== null && aCornAvg !== null) {
      const expC = hCornAvg + aCornAvg;
      const lines = [7.5, 8.5, 9.5, 10.5];
      let bestC = null;
      lines.forEach(l => {
        const pOver = poissonOverProb(l, expC);
        const pUnder = 1 - pOver;
        if (pOver >= 0.65 && (!bestC || pOver > bestC.p)) bestC = { label: `Peste ${l}`, p: pOver, exp: expC };
        if (pUnder >= 0.65 && (!bestC || pUnder > bestC.p)) bestC = { label: `Sub ${l}`, p: pUnder, exp: expC };
      });
      if (bestC) cornerPred = `${bestC.label} (${Math.round(bestC.p * 100)}%, medie reală ${bestC.exp.toFixed(1)})`;
    }

    const hCardAvg = extractAvgFromEvents(data.boxscore.form[0], ["yellowCards"]);
    const aCardAvg = extractAvgFromEvents(data.boxscore.form[1], ["yellowCards"]);
    if (hCardAvg !== null && aCardAvg !== null) {
      const expK = hCardAvg + aCardAvg;
      const lines = [3.5, 4.5, 5.5];
      let bestK = null;
      lines.forEach(l => {
        const pOver = poissonOverProb(l, expK);
        const pUnder = 1 - pOver;
        if (pOver >= 0.65 && (!bestK || pOver > bestK.p)) bestK = { label: `Peste ${l}`, p: pOver, exp: expK };
        if (pUnder >= 0.65 && (!bestK || pUnder > bestK.p)) bestK = { label: `Sub ${l}`, p: pUnder, exp: expK };
      });
      if (bestK) cardPred = `${bestK.label} (${Math.round(bestK.p * 100)}%, medie reală ${bestK.exp.toFixed(1)})`;
    }
  }

  return { referee, actualCorners, actualCards, shots, possession, cornerPred, cardPred };
}

function renderRealStatsBlock(m, st) {
  const cornerLine = st.cornerPred
    ? `<b style="color:var(--neon-cyan);">${esc(st.cornerPred)}</b>`
    : `<span style="color:var(--text-muted);">Nu există pronostic disponibil (fără date reale pe echipe)</span>`;

    : `<span style="color:var(--text-muted);">Nu există pronostic disponibil (fără date reale pe echipe / arbitru)</span>`;

  return `🚩 Cornere: ${cornerLine}${liveCorn}<br>🟨 Cartonașe: ${cardLine}${liveCard}${extraBits ? `<br>${extraBits}` : ""}`;
}

const saveLog = l => { try { localStorage.setItem(LOG_KEY, JSON.stringify(l)); } catch(e) {} };

function calibCard() {

      <div>Prezis în medie <b>${Math.round(avg(rows)*100)}%</b> · real <b>${Math.round(hit(rows)*100)}%</b></div>${bins}

async function fetchWithTimeout(url, timeoutMs = 8000) {
  const controller = new AbortController(), timer = setTimeout(() => controller.abort(), timeoutMs);
  try { const res = await fetch(url, { signal: controller.signal }); clearTimeout(timer); return await res.json(); }
  catch (e) { clearTimeout(timer); throw e; }
}

// Interogare pe 2 zile (ieri-azi) pentru a prinde și meciurile de noapte (00:00–06:59 EET) + deduplicare pe ev.id
async function loadMatchesForDate(iso, forceRefresh = false) {
  renderSubBars();
  if (!forceRefresh && cacheByDate[iso] && cacheByDate[iso].length && cacheByDate[iso][0].ver === MODEL_VERSION) { renderViewport(); return; }
  const vp = document.getElementById("viewport");
  if(vp && (currentNav === "meciuri" || forceRefresh)) vp.innerHTML = `<div class="cyber-card" style="text-align:center;padding:28px;color:var(--neon-cyan);">⚡ Joe actualizează cotele, scorurile și predicțiile pentru <b>${iso}</b>...</div>`;
  const prevIso = new Date(new Date(iso + "T12:00:00Z").getTime() - 86400000).toISOString().slice(0, 10);
  const rangeStr = `${prevIso.replace(/-/g, "")}-${iso.replace(/-/g, "")}`;
  const res = await Promise.all(LEAGUES.map(l =>
    fetchWithTimeout(`https://site.api.espn.com/apis/site/v2/sports/soccer/${l.slug}/scoreboard?dates=${rangeStr}`)
      .then(d => ({ l, evs: (d && d.events) || [] }))
      .catch(() => ({ l, evs: [] }))
  ));
  const list = [], seenIds = new Set();
  res.forEach(r => r.evs.forEach(ev => {
    try {
      const eid = String(ev.id);
      if (seenIds.has(eid)) return;
      const m = analyzeMatch(ev, r.l);
      if (m && m.date === iso) { seenIds.add(eid); list.push(m); }
    } catch (e) {}
  }));
  list.sort((a, b) => a.time.localeCompare(b.time));
  if (list.length > 0) {
    cacheByDate[iso] = list;
    try { localStorage.setItem("joe_cache_v9_" + iso, JSON.stringify(list)); } catch (e) {}
  } else {
    try { const backup = localStorage.getItem("joe_cache_v9_" + iso); cacheByDate[iso] = backup ? JSON.parse(backup) : []; } catch (e) { cacheByDate[iso] = []; }
  }
  logAndSettle(cacheByDate[iso]);
  autoSettleProjectBets(cacheByDate[iso]);
  renderViewport();
}

function recalcBankroll(shouldSave = true) {
  let b = project.initial_bankroll || 500.0;
  (project.bets || []).forEach(bet => { if (bet.status === "WIN") b += bet.stake * (bet.odd - 1); else if (bet.status === "LOSS") b -= bet.stake; });
  project.bankroll = +b.toFixed(2);
  const topBankroll = document.getElementById("topBankroll");
  if(topBankroll) topBankroll.innerText = project.bankroll.toFixed(2);
  if (shouldSave) saveToDB();
}

function autoSettleProjectBets(list) {
  let ch = false;
  (project.bets || []).forEach(b => {
    if (b.status !== "PENDING") return;
    const f = list.find(m => String(m.id) === String(b.matchId) && m.status === "FT");
    if (f && f.score90Valid && f.hScore90 !== null) {
      const w = checkBetOutcome(b.pick, f.hScore90, f.aScore90, f.hHT, f.aHT, f.score90Valid);
      if (w !== null) { b.status = w ? "WIN" : "LOSS"; b.score = `${f.hScore90}-${f.aScore90}${f.isAET ? " (90')" : ""}`; ch = true; }
    }
  });
  if (ch) recalcBankroll(true);
}

function addMatchToProject(matchId) {
  if (!hasJoeAccess()) return;
  const all = [...(cacheByDate[selectedDate] || []), ...europaMatches];

  if (!m) return;
  if (!project.bets.some(b => String(b.matchId) === String(m.id))) {
    const smart = calculateSmartStake(project.bankroll, m);
    project.bets.unshift({ id: Date.now(), matchId: m.id, date: m.date, match: `${m.home} vs ${m.away}`, league: m.league, pick: m.pick, odd: m.odd, stake: smart.stake, status: "PENDING", score: "" });
    recalcBankroll(true);
  }
  switchNav("proiect");
}

function compressImageFile(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height; const M = 1100;
        if (w > M || h > M) { if (w > h) { h = Math.round(h * M / w); w = M; } else { w = Math.round(w * M / h); h = M; } }
        const cv = document.createElement("canvas"); cv.width = w; cv.height = h; cv.getContext("2d").drawImage(img, 0, 0, w, h);
        res({ base64: cv.toDataURL("image/jpeg", 0.82), mimeType: "image/jpeg" });
      };
      img.onerror = () => res({ base64: e.target.result, mimeType: file.type || "image/jpeg" });
      img.src = e.target.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

const CHALLENGE_KEY = "joe_challenge_state_v2";

function getTodayChallengePicks(forceRegenerate = false) {
  const st = getStoredChallengeState();
  let currentActive = st.history.find(h => h.id === st.activeId);
  const allToday = cacheByDate[selectedDate] || [];
  const byId = {};
  allToday.forEach(m => { byId[String(m.id)] = m; });

  // Dacă există deja un bilet înghețat pentru (activeId, currentDay, selectedDate), îl păstrăm ca să nu se schimbe după startul meciului 1
  if (!forceRegenerate && currentActive && currentActive.lockedTicket &&
      currentActive.lockedTicket.day === st.currentDay &&
      currentActive.lockedTicket.date === selectedDate &&
      Array.isArray(currentActive.lockedTicket.picks) &&
      currentActive.lockedTicket.picks.length > 0) {
    const hydrated = currentActive.lockedTicket.picks.map(p => {
      const liveM = byId[String(p.id)];
      if (!liveM) return p;
      return {
        ...p,
        status: liveM.status, hScore: liveM.hScore, aScore: liveM.aScore,
        hScore90: liveM.hScore90, aScore90: liveM.aScore90,
        isAET: liveM.isAET, score90Valid: liveM.score90Valid,
        hHT: liveM.hHT, aHT: liveM.aHT
      };
    });
    const totOdd = +(hydrated.reduce((acc, m) => acc * m.odd, 1)).toFixed(2);
    const allStillNS = hydrated.every(p => p.status === "NS");
    return { picks: hydrated, totOdd, alreadyPlayedDay: false, locked: true, canRegen: allStillNS };
  }

  const usedIds = new Set();
  if (currentActive && Array.isArray(currentActive.steps)) {
    currentActive.steps.forEach(s => {
      if (Array.isArray(s.matchIds)) s.matchIds.forEach(id => usedIds.add(String(id)));
    });
  }

  const todayIso = roDateStr(new Date());
  const eligible = allToday.filter(m => !m.lowData && !usedIds.has(String(m.id)));
  const dayPool = (selectedDate >= todayIso) ? eligible.filter(m => m.status === "NS") : eligible;

  dayPool.sort((a, b) => {
    const scA = (a.chalProb || a.prob) * (a.src === "market" ? 1.05 : 0.90);
    const scB = (b.chalProb || b.prob) * (b.src === "market" ? 1.05 : 0.90);
    return scB - scA;
  });

  const topPool = dayPool.slice(0, 12).map(m => ({
    id: String(m.id), home: m.home, away: m.away, league: m.league, time: m.time,
    status: m.status, hScore: m.hScore, aScore: m.aScore, hScore90: m.hScore90, aScore90: m.aScore90,
    isAET: m.isAET, score90Valid: m.score90Valid, hHT: m.hHT, aHT: m.aHT,
    pick: m.chalPick || m.pick, prob: m.chalProb || m.prob, odd: m.chalOdd || m.odd, oddReal: !!m.chalReal
  }));

  if (topPool.length < 2) {
    return { picks: [], totOdd: 1.50, alreadyPlayedDay: usedIds.size > 0 && eligible.length < 2, locked: false, canRegen: false };
  }

  let bestPair = [topPool[0], topPool[1]];
  let bestScore = -999;
  for (let i = 0; i < topPool.length; i++) {
    for (let j = i + 1; j < topPool.length; j++) {
      const m1 = topPool[i], m2 = topPool[j];
      const prodOdd = +(m1.odd * m2.odd).toFixed(2);
      const jointProb = (m1.prob / 100) * (m2.prob / 100);
      const distFrom150 = Math.abs(prodOdd - 1.52);
      const score = jointProb - distFrom150 * 0.45;
      if (score > bestScore) { bestScore = score; bestPair = [m1, m2]; }
    }
  }

  const realProductOdd = +(bestPair[0].odd * bestPair[1].odd).toFixed(2);
  if (currentActive) {
    currentActive.lockedTicket = { day: st.currentDay, date: selectedDate, picks: bestPair };
    saveStoredChallengeState(st);
  }
  return { picks: bestPair, totOdd: realProductOdd, alreadyPlayedDay: false, locked: true, canRegen: bestPair.every(p => p.status === "NS") };
}

function regenerateChallengeTicket() {
  getTodayChallengePicks(true);
  customChallengeOdd = null;
  renderViewport();
  showToast("🔄 Bilet Challenge actualizat!");
}

function copyChallengeTicket() {
  const st = getStoredChallengeState();
  const { picks, totOdd } = getTodayChallengePicks();
  if (!picks.length) return;
  const effOdd = customChallengeOdd && customChallengeOdd > 1.05 ? customChallengeOdd : totOdd;
  const potWin = +(st.currentStake * effOdd).toFixed(2);
  const header = `🎯 JOE CHALLENGE #${st.activeId} · ZIUA ${st.currentDay}/16 (${selectedDate})\nMiză: ${st.currentStake.toFixed(2)} RON | Cotă: @${effOdd.toFixed(2)} | Câștig: ${potWin} RON`;
  const lines = picks.map((m, i) => `${i + 1}. ${m.home} vs ${m.away} -> ${m.pick} (@${m.odd.toFixed(2)})`);
  copyText([header, ...lines].join("\n"));
}

function updateChallengeCustomOdd(val) {
  const num = parseFloat(val);
  const st = getStoredChallengeState();
  if (!isNaN(num) && num >= 1.05) {
    customChallengeOdd = +num.toFixed(2);
  } else {
    customChallengeOdd = null;
  }
  const { totOdd } = getTodayChallengePicks();
  const effOdd = customChallengeOdd || totOdd;
  const potWin = +(st.currentStake * effOdd).toFixed(2);
  const winEl = document.getElementById("chalPotWinLabel");
  if (winEl) winEl.innerText = potWin.toFixed(2) + " RON";
}

function recalcChallengeMax(h) {
  let mx = h.startStake || 10.0;
  (h.steps || []).forEach(s => { if (s.status === "WIN" && s.returnAmount > mx) mx = s.returnAmount; });
  h.maxReached = +mx.toFixed(2);
}

function undoLastChallengeStep() {
  const st = getStoredChallengeState();
  let currentActive = st.history.find(h => h.id === st.activeId);
  if (currentActive && (!currentActive.steps || currentActive.steps.length === 0) && st.history.length > 1) {
    if (!confirm("Anulezi ultima resetare și revii la Challenge-ul anterior?")) return;
    st.history.pop();
    const prev = st.history[st.history.length - 1];
    prev.status = 'RUNNING';
    const lastStep = prev.steps.pop();
    recalcChallengeMax(prev);
    delete prev.lockedTicket;
    st.activeId = prev.id;
    st.currentDay = lastStep ? lastStep.day : 1;
    st.currentStake = lastStep ? lastStep.stake : 10.0;
    prev.currentDay = st.currentDay;
    saveStoredChallengeState(st);
    renderViewport();
    return;
  }
  if (!currentActive || !currentActive.steps || currentActive.steps.length === 0) return;
  if (!confirm("Anulezi ultimul pas înregistrat?")) return;
  const removed = currentActive.steps.pop();
  recalcChallengeMax(currentActive);
  delete currentActive.lockedTicket;
  st.currentDay = removed.day;
  st.currentStake = removed.stake;
  currentActive.currentDay = st.currentDay;
  currentActive.status = 'RUNNING';
  saveStoredChallengeState(st);
  renderViewport();
}

function settleChallengeDay(outcome) {
  const { picks, totOdd } = getTodayChallengePicks();
  if (picks.length < 2) return;

  const st = getStoredChallengeState();
  let currentActive = st.history.find(h => h.id === st.activeId);
  if (!currentActive) {
    currentActive = { id: st.activeId, status: 'RUNNING', currentDay: st.currentDay, startStake: 10.0, finalReturn: 0.0, maxReached: 10.0, steps: [] };
    st.history.push(currentActive);
  }

  const effOdd = customChallengeOdd && customChallengeOdd > 1.05 ? customChallengeOdd : totOdd;
  const usedStake = +st.currentStake.toFixed(2);
  const returnAmount = +(usedStake * effOdd).toFixed(2);
  const summaryText = picks.map(p => `${p.home} vs ${p.away}: ${p.pick} (@${p.odd.toFixed(2)})`).join(" + ");

  currentActive.currentDay = st.currentDay;
  currentActive.steps.push({
    day: st.currentDay,
    date: selectedDate,
    matchIds: picks.map(p => String(p.id)),
    stake: usedStake,
    odd: effOdd,
    returnAmount: outcome === 'WIN' ? returnAmount : 0,
    summary: summaryText,
    status: outcome
  });
  delete currentActive.lockedTicket;
  customChallengeOdd = null;

  if (outcome === 'WIN') {
    recalcChallengeMax(currentActive);
    if (st.currentDay >= 16) {
      currentActive.status = 'WIN';
      currentActive.finalReturn = returnAmount;
      alert(`🏆 FELICITĂRI! Ai dus Challenge #${st.activeId} până la capăt (Ziua 16) și ai ajuns la ${returnAmount} RON! Pornim acum Challenge #${st.activeId + 1} de la 10 RON.`);
      st.activeId += 1;
      st.currentDay = 1;
      st.currentStake = 10.0;
      st.history.push({ id: st.activeId, status: 'RUNNING', currentDay: 1, startStake: 10.0, finalReturn: 0.0, maxReached: 10.0, startedAt: selectedDate, steps: [] });
    } else {
      st.currentDay += 1;
      st.currentStake = returnAmount;
      currentActive.currentDay = st.currentDay;
    }
  } else {
    currentActive.status = 'LOSS';
    currentActive.finalReturn = 0;
    alert(`✖ Bilet pierdut în Ziua ${st.currentDay}. Challenge #${st.activeId} a fost salvat în istoric. Pornim Challenge #${st.activeId + 1} de la Ziua 1 cu miza de 10 RON!`);
    st.activeId += 1;
    st.currentDay = 1;
    st.currentStake = 10.0;
    st.history.push({ id: st.activeId, status: 'RUNNING', currentDay: 1, startStake: 10.0, finalReturn: 0.0, maxReached: 10.0, startedAt: selectedDate, steps: [] });
  }

  saveStoredChallengeState(st);
  renderViewport();
}

function computeRealPerformanceStats(dayPool) {
  const settledBets = (project.bets || []).filter(b => b.status === "WIN" || b.status === "LOSS");
  const wonBets = settledBets.filter(b => b.status === "WIN").length;
  const ftMatches = (dayPool || []).filter(m => m.status === "FT" && m.score90Valid && m.hScore90 !== null && m.aScore90 !== null);
  let ftHits = 0;
  ftMatches.forEach(m => { if (checkBetOutcome(m.pick, m.hScore90, m.aScore90, m.hHT, m.aHT, m.score90Valid) === true) ftHits++; });
  let winRateText = "În calcul";
  if (settledBets.length > 0) winRateText = `${Math.round((wonBets / settledBets.length) * 100)}% (${wonBets}/${settledBets.length})`;
  else if (ftMatches.length > 0) winRateText = `${Math.round((ftHits / ftMatches.length) * 100)}% (${ftHits}/${ftMatches.length} azi)`;
  let avgOddText = "—";
  if ((project.bets || []).length > 0) avgOddText = (project.bets.reduce((acc, b) => acc + (parseFloat(b.odd) || 1.5), 0) / project.bets.length).toFixed(2);
  else if (dayPool && dayPool.length > 0) avgOddText = (dayPool.reduce((acc, m) => acc + m.odd, 0) / dayPool.length).toFixed(2);
  return { winRateText, avgOddText };
}

    ${note}

  <div class="cyber-card" style="border-color:var(--neon-cyan);margin-top:14px;">

  cota500Mode = checkbox.checked;

function renderViewport() {
  renderSubBars();
  const vp = document.getElementById("viewport");
  if(!vp) return;
  if (currentNav === "admin" && isAdmin()) { vp.innerHTML = renderAdminView(); return; }
  if (currentNav === "proiect" && hasJoeAccess()) { vp.innerHTML = renderProjectView(); setTimeout(updateChatUI, 40); return; }
  if (currentNav === "challenge") { vp.innerHTML = renderChallengeView(); return; }
  if (currentNav === "bilete") { vp.innerHTML = renderTicketsView(); return; }
  
  const searchTerm = (document.getElementById("matchSearchInput")?.value || "").toLowerCase().trim();
  let list = currentNav === "europa" ? europaMatches : (cacheByDate[selectedDate] || []).filter(m => selectedLeague === "ALL" || m.league === selectedLeague);
  if (searchTerm) list = list.filter(m => m.home.toLowerCase().includes(searchTerm) || m.away.toLowerCase().includes(searchTerm) || m.league.toLowerCase().includes(searchTerm));
  if (!list.length) {
    vp.innerHTML = `<div class="cyber-card" style="text-align:center;padding:26px;color:var(--text-muted);line-height:1.6;">
      Niciun meci programat în ligile selectate pentru <b>${selectedDate}</b>.<br>
      <span style="font-size:11px;color:var(--neon-cyan);">💡 Selectează o altă zi din bara de sus sau apasă pe tab-ul <b>🏆 Europa</b> pentru cupele europene și <b>UEFA Nations League</b>.</span>
    </div>`;
    return;
  }
  
  const groups = {};
  list.forEach(m => { if (!groups[m.league]) groups[m.league] = { icon: m.icon, items: [] }; groups[m.league].items.push(m); });
  vp.innerHTML = Object.keys(groups).map(lg => `<div class="cyber-sec-head"><span>${groups[lg].icon} ${esc(lg)}</span><span>${groups[lg].items.length} meciuri</span></div>${groups[lg].items.map(renderMatchCard).join("")}`).join("");
}

function selectDay(iso) {
  selectedDate = iso; selectedLeague = "ALL";
  customChallengeOdd = null;
  const searchInput = document.getElementById("matchSearchInput");
  if(searchInput) searchInput.value = "";
  loadMatchesForDate(iso);
}

function selectLeague(lg) { selectedLeague = lg; renderViewport(); }

async function switchNav(tab) {
  if (tab === "proiect" && !hasJoeAccess()) return;
  if (tab === "admin" && !isAdmin()) return;
  currentNav = tab;
  document.querySelectorAll(".hud-nav-item").forEach(b => b.classList.remove("active"));
  const btn = document.getElementById("nav-" + tab);
  if (btn) btn.classList.add("active");
  if (tab === "admin") await fetchAdminUsersList();
  if (tab === "europa") loadEuropaMatches(); else renderViewport();
}

(async function startApp() {
  pruneOldStorage();
  selectedDate = getDatesList()[1].iso;
  const savedUser = localStorage.getItem("xmts_logged_user");
  const savedAdmToken = sessionStorage.getItem("xmts_adm_token");
  if (savedUser) {
    try {
      const parsed = JSON.parse(savedUser);
      const isExpired = parsed.role !== "admin" && parsed.expires_at && new Date(parsed.expires_at) < new Date();
      if (!isExpired && parsed.username) {
        currentUser = parsed;
        if (parsed.role === "admin" && savedAdmToken) { adminSessionPass = savedAdmToken; await fetchAdminUsersList(); }
        document.getElementById("loginScreen").style.display = "none";
        applyRolePermissions();
      } else {
        localStorage.removeItem("xmts_logged_user");
      }
    } catch (e) {}
  }
  await initProject();
  loadMatchesForDate(selectedDate);
})();
