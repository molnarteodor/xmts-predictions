function power(name, slug) {
  const n = norm(name);

}

function calculateExpiresAt(duration) {
  const now = new Date();
  if (duration === 'trial') now.setDate(now.getDate() + 2);
  else if (duration === '1_month') now.setMonth(now.getMonth() + 1);
  else if (duration === '3_months') now.setMonth(now.getMonth() + 3);
  else if (duration === '6_months') now.setMonth(now.getMonth() + 6);
  else if (duration === '1_year') now.setFullYear(now.getFullYear() + 1);
  else now.setMonth(now.getMonth() + 1);
  return now.toISOString();
}

function formatExpiryDate(isoStr) {
  if (!isoStr) return "Permanent / Nelimitat";
  return new Date(isoStr).toLocaleDateString("ro-RO", { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
}

function poissonPmf(k, lam) {
  let f = 1; for (let i = 2; i <= k; i++) f *= i;
  return Math.exp(-lam) * Math.pow(lam, k) / f;
}

function poissonOverProb(line, lam) {
  const minK = Math.floor(line) + 1; let cdf = 0;
  for (let k = 0; k < minK; k++) cdf += poissonPmf(k, lam);
  return Math.max(0.05, Math.min(0.95, 1 - cdf));
}

function selectOptimalStatLine(expVal, overLines, underLines) {
  const options = [];
  for (let l of overLines) {
    const p = poissonOverProb(l, expVal);
    if (p >= 0.55 && p <= 0.76) options.push({ label: `Peste ${l}`, prob: Math.round(p * 100), score: p * (1 - Math.abs(p - 0.66) * 1.4) });
  }
  for (let l of underLines) {
    const p = 1 - poissonOverProb(l, expVal);
    if (p >= 0.57 && p <= 0.76) options.push({ label: `Sub ${l}`, prob: Math.round(p * 100), score: p * (1 - Math.abs(p - 0.66) * 1.4) * 0.98 });
  }
  if (!options.length) {
    const midLine = overLines[1] || overLines[0], p = poissonOverProb(midLine, expVal);
    return p >= 0.50 ? { label: `Peste ${midLine}`, prob: Math.round(p * 100) } : { label: `Sub ${midLine + 1}`, prob: Math.round((1 - poissonOverProb(midLine + 1, expVal)) * 100) };
  }
  options.sort((a, b) => b.score - a.score);
  return options[0];
}

function dixonColesTau(h, a, lamH, lamA, rho = -0.09) {
  if (h === 0 && a === 0) return Math.max(0.5, 1 - lamH * lamA * rho);
  if (h === 0 && a === 1) return Math.max(0.5, 1 + lamH * rho);
  if (h === 1 && a === 0) return Math.max(0.5, 1 + lamA * rho);
  if (h === 1 && a === 1) return Math.max(0.5, 1 - rho);
  return 1.0;
}

// Calibrare realistă a cotelor după structura de marjă Superbet / Betano (fără plafon fals de @1.18)
function calcRealisticOdd(p, realOdd = null) {
  if (realOdd && realOdd >= 1.02) return +realOdd.toFixed(2);
  const prob = Math.max(0.08, Math.min(0.96, p));
  const fairProfit = (1 / prob) - 1;
  let retention = 0.84;
  if (prob >= 0.86) retention = 0.45;      // ex: 88% -> @1.06 (exclus automat ca fiind prea mic)
  else if (prob >= 0.82) retention = 0.52; // ex: 84% -> @1.09 (exclus automat)
  else if (prob >= 0.78) retention = 0.62; // ex: 79% -> @1.16
  else if (prob >= 0.73) retention = 0.71; // ex: 75% -> @1.24 (ideal pt Challenge)
  else if (prob >= 0.68) retention = 0.77; // ex: 70% -> @1.33
  else if (prob >= 0.60) retention = 0.82; // ex: 65% -> @1.44
  return Math.max(1.02, +(1 + fairProfit * retention).toFixed(2));
}

function extractMarketOdds(comp) {
  if (!comp.odds || !Array.isArray(comp.odds) || comp.odds.length === 0) return null;
  const oddObj = comp.odds.find(o => o && (o.homeTeamOdds || o.overUnder)) || comp.odds[0];
  if (!oddObj) return null;
  const mlToDec = (ml) => {
    const n = parseFloat(ml);
    if (isNaN(n) || n === 0) return null;
    if (n > 1.02 && n < 25.0) return n;
    if (Math.abs(n) < 100) return null;
    const dec = n > 0 ? 1 + (n / 100) : 1 + (100 / Math.abs(n));
    return (dec >= 1.03 && dec <= 35.0) ? dec : null;
  };
  let mktPH = null, mktPD = null, mktPA = null, decH = null, decD = null, decA = null;
  if (oddObj.homeTeamOdds && oddObj.awayTeamOdds) {
    decH = mlToDec(oddObj.homeTeamOdds.moneyLine);
    decA = mlToDec(oddObj.awayTeamOdds.moneyLine);
    decD = oddObj.drawOdds ? mlToDec(oddObj.drawOdds.moneyLine) : null;
    if (decH && decA) {
      const gap = Math.abs(1 / decH - 1 / decA);
      const dynamicDrawOdd = Math.min(6.80, Math.max(3.15, 3.25 + gap * 3.8));
      const effD = decD || dynamicDrawOdd;
      const invH = 1 / decH, invD = 1 / effD, invA = 1 / decA, overround = invH + invD + invA;
      mktPH = invH / overround; mktPD = invD / overround; mktPA = invA / overround;
    }
  }
  const ouLine = oddObj.overUnder ? parseFloat(oddObj.overUnder) : null;
  return { mktPH, mktPD, mktPA, decH, decD, decA, ouLine };
}

function extractRealTeamProfile(compObj, isHome, teamName, slug) {
  const baseP = power(teamName, slug);
  let recScore = null, venueScore = null, formScore = null, drawRatio = 0.25;

  if (compObj.records && Array.isArray(compObj.records)) {
    const parseRec = (rec) => {
      if (!rec || !rec.summary) return null;
      const parts = rec.summary.split("-").map(x => parseInt(x, 10));
      if (parts.length === 3 && !isNaN(parts[0])) {
        const [w, d, l] = parts, tot = w + d + l;
        if (tot > 0) return { w, d, l, tot, ppg: (w * 3 + d) / tot };
      }
      return null;
    };
    const totalRec = parseRec(compObj.records.find(r => r.type === "total") || compObj.records[0]);
    const venueRec = parseRec(compObj.records.find(r => r.type === (isHome ? "home" : "road") || (r.name && r.name.toLowerCase() === (isHome ? "home" : "away"))));
    if (totalRec) {
      const rel = Math.min(1.0, totalRec.tot / (totalRec.tot + 5));
      recScore = (totalRec.ppg - 1.36) * 0.42 * rel;
      drawRatio = (totalRec.d / totalRec.tot) * rel + 0.25 * (1 - rel);
    }
    if (venueRec && venueRec.tot >= 2) {
      const vRel = Math.min(1.0, venueRec.tot / (venueRec.tot + 4));
      venueScore = (venueRec.ppg - (isHome ? 1.52 : 1.18)) * 0.36 * vRel;
    }
  }

  if (compObj.form && typeof compObj.form === "string") {
    const raw = compObj.form.toUpperCase().replace(/[^WDL]/g, "").slice(-5);
    if (raw.length >= 3) {
      const weights = [0.65, 0.80, 1.0, 1.18, 1.35];
      let fs = 0, dCount = 0;
      for (let i = 0; i < raw.length; i++) {
        const ch = raw[i], w = weights[i + (5 - raw.length)] || 1.0;
        if (ch === "W") fs += 0.055 * w;
        else if (ch === "L") fs -= 0.055 * w;
        else dCount++;
      }
      formScore = fs;
      drawRatio = drawRatio * 0.7 + (dCount / raw.length) * 0.3;
    }
  }

  const hasStats = recScore !== null || formScore !== null;
  let empirical = 0;
  if (recScore !== null && venueScore !== null) empirical = recScore * 0.65 + venueScore * 0.35;
  else if (recScore !== null) empirical = recScore;
  if (formScore !== null) empirical = recScore !== null ? (empirical * 0.68 + formScore * 0.32) : formScore;

  let finalPower = 0;
  if (baseP !== null && hasStats) finalPower = baseP * 0.55 + empirical * 0.45;
  else if (baseP !== null) finalPower = baseP;
  else if (hasStats) finalPower = empirical;

  const summaryStr = [(compObj.records && compObj.records[0] && compObj.records[0].summary) || "", compObj.form || ""].filter(Boolean).join(" · ") || (baseP !== null ? "Power Matrix" : "—");

  return {
    power: Math.max(-0.55, Math.min(0.65, finalPower)),
    drawRatio: Math.max(0.14, Math.min(0.38, drawRatio)),
    hasData: baseP !== null || hasStats,
    formLabel: summaryStr
  };
}

function probsGrid(lH, lA, rho) {
  const ph = [], pa = []; let f = 1;
  for (let k = 0; k < 10; k++) { if (k > 1) f *= k; ph[k] = Math.exp(-lH) * Math.pow(lH, k) / f; pa[k] = Math.exp(-lA) * Math.pow(lA, k) / f; }
  let s = 0, H = 0, D = 0, A = 0, o15 = 0, o25 = 0, o35 = 0, gg = 0;
  let dc1X_o15 = 0, dcX2_o15 = 0, dc1X_u35 = 0, dcX2_u35 = 0, h_o15 = 0, a_o15 = 0, h_o25 = 0, a_o25 = 0;
  for (let h = 0; h < 10; h++) for (let a = 0; a < 10; a++) {
    const p = ph[h] * pa[a] * dixonColesTau(h, a, lH, lA, rho), t = h + a; s += p;
    if (h > a) H += p; else if (h === a) D += p; else A += p;
    if (t >= 2) o15 += p; if (t >= 3) o25 += p; if (t >= 4) o35 += p; if (h && a) gg += p;
    if (h >= a && t >= 2) dc1X_o15 += p;
    if (a >= h && t >= 2) dcX2_o15 += p;
    if (h >= a && t <= 3) dc1X_u35 += p;
    if (a >= h && t <= 3) dcX2_u35 += p;
    if (h > a && t >= 2) h_o15 += p;
    if (a > h && t >= 2) a_o15 += p;
    if (h > a && t >= 3) h_o25 += p;
    if (a > h && t >= 3) a_o25 += p;
  }
  return {
    H: H/s, D: D/s, A: A/s, o15: o15/s, o25: o25/s, o35: o35/s, u35: 1 - o35/s, gg: gg/s,
    dc1X_o15: dc1X_o15/s, dcX2_o15: dcX2_o15/s, dc1X_u35: dc1X_u35/s, dcX2_u35: dcX2_u35/s,
    h_o15: h_o15/s, a_o15: a_o15/s, h_o25: h_o25/s, a_o25: a_o25/s
  };
}

function fitToMarket(mH, mD, mA, tPrior, w, rho) {
  let best = null;
  for (let T = 1.75; T <= 4.30; T += 0.05) for (let sh = 0.12; sh <= 0.88; sh += 0.01) {
    const g = probsGrid(T * sh, T * (1 - sh), rho);
    const e = (g.H - mH) ** 2 + (mD == null ? 0 : (g.D - mD) ** 2 * 0.65) + (g.A - mA) ** 2 + w * (T - tPrior) ** 2;
    if (!best || e < best.e) best = { e, lH: T * sh, lA: T * (1 - sh), g };
  }
  return best;
}

function analyzeMatch(ev, lg) {
  const comp = ev.competitions[0], cs = comp.competitors;
  const home = cs.find(c => c.homeAway === "home") || cs[0], away = cs.find(c => c.homeAway === "away") || cs[1];
  const hName = home.team.displayName || home.team.name, aName = away.team.displayName || away.team.name;
  const dt = new Date(comp.date || ev.date), stState = (comp.status && comp.status.type && comp.status.type.state) || "pre";
  const sc = c => c.score !== undefined ? parseInt(c.score, 10) : null;
  const ht = c => (c.linescores && c.linescores.length && c.linescores[0].value !== undefined) ? parseInt(c.linescores[0].value, 10) : null;

  const hProf = extractRealTeamProfile(home, true, hName, lg.slug);
  const aProf = extractRealTeamProfile(away, false, aName, lg.slug);
  const lowData = !hProf.hasData && !aProf.hasData;
  const diff = hProf.power - aProf.power;
  const isDerby = Math.abs(diff) <= 0.12 && hProf.power >= 0.24 && aProf.power >= 0.24;

  const rho = (lg.rho || -0.09) + (isDerby ? -0.02 : 0), gBase = lg.gBase || 2.62;
  const avgDraw = (hProf.drawRatio + aProf.drawRatio) / 2;
  const bothAttacking = (hProf.power >= 0.18 && aProf.power >= 0.18) ? 0.28 : 0;
  const mismatchBoost = Math.abs(diff) >= 0.35 ? Math.abs(diff) * 0.55 : Math.abs(diff) * 0.30;
  const paceMod = (0.25 - avgDraw) * 0.65 + (hProf.power + aProf.power) * 0.28 + mismatchBoost + bothAttacking;
  const teamExpectedT = Math.max(2.05, Math.min(3.85, gBase + paceMod));
  const modelShare = Math.min(0.82, Math.max(0.18, 1 / (1 + Math.exp(-(0.16 + diff * 1.95)))));

  const mkt = extractMarketOdds(comp);
  const hasMkt = !!(mkt && mkt.mktPH && mkt.mktPA);
  let src = "model", lH, lA, g;

  if (hasMkt) {
    const tp = (mkt.ouLine >= 1.5 && mkt.ouLine <= 4.5) ? (mkt.ouLine * 0.65 + teamExpectedT * 0.35) : teamExpectedT;
    const f = fitToMarket(mkt.mktPH, mkt.decD ? mkt.mktPD : null, mkt.mktPA, tp, mkt.ouLine ? 0.06 : 0.045, rho);
    lH = f.lH * 0.85 + (teamExpectedT * modelShare) * 0.15;
    lA = f.lA * 0.85 + (teamExpectedT * (1 - modelShare)) * 0.15;
    g = probsGrid(lH, lA, rho);
    src = "market";
  } else {
    lH = teamExpectedT * modelShare;
    lA = teamExpectedT * (1 - modelShare);
    g = probsGrid(lH, lA, rho);
  }

  const T = lH + lA;
  const winDiff = g.H - g.A;

  const stat = (x, ns) => { for (const n of ns) { const f = (x.statistics || []).find(s => s.name === n || s.abbreviation === n); if (f) { const v = parseFloat(f.displayValue); if (!isNaN(v)) return v; } } return null; };
  const hc = stat(home, ["wonCorners","cornerKicks","corners","CK"]), ac = stat(away, ["wonCorners","cornerKicks","corners","CK"]);
  const hy = stat(home, ["yellowCards","YC"]), ay = stat(away, ["yellowCards","YC"]);
  const hr = stat(home, ["redCards","RC"]) || 0, ar = stat(away, ["redCards","RC"]) || 0;

  const pressureC = Math.abs(lH - lA) * 0.65;
  const expC = Math.max(7.2, Math.min(12.6, (lg.cBase || 9.5) + (T - gBase) * 1.15 + pressureC));
  const balanceK = (1 - Math.abs(g.H - g.A)) * 0.75 + (isDerby ? 0.55 : 0) + (avgDraw - 0.25) * 1.8;
  const expK = Math.max(2.6, Math.min(6.4, (lg.kBase || 4.3) + balanceK));
  const co = selectOptimalStatLine(expC, [7.5, 8.5, 9.5], [9.5, 10.5]);
  const ko = selectOptimalStatLine(expK, [3.5, 4.5], [4.5, 5.5]);

  const c = [];
  const add = (name, mk, p, realOdd, typeBonus = 1.0) => {
    const bookieOdd = calcRealisticOdd(p, realOdd);
    const fairOdd = +(1 / Math.max(0.12, p)).toFixed(2);
    const edge = realOdd ? Math.round((p * realOdd - 1) * 100) : 0;
    const distFromSweet = Math.abs(bookieOdd - 1.44);
    const sweetFactor = Math.max(0.68, 1 - distFromSweet * 0.65);
    const utility = p * sweetFactor * typeBonus * (edge > 0 ? 1.05 : 1.0);
    c.push({ name, mk, p, odd: bookieOdd, fairOdd, real: !!realOdd, edge, utility });
  };

  if (winDiff >= 0.14) add(`1 (${hName})`, "SOLO", g.H, hasMkt ? mkt.decH : null, 1.04);
  if (winDiff <= -0.14) add(`2 (${aName})`, "SOLO", g.A, hasMkt ? mkt.decA : null, 1.04);
  if (winDiff >= -0.02) add("Șansă Dublă 1X", "DC", g.H + g.D, null, 0.98);
  if (winDiff <= 0.02) add("Șansă Dublă X2", "DC", g.A + g.D, null, 0.98);
  if (T >= 2.42) add("Peste 1.5 Goluri", "O15", g.o15, null, 0.97);
  if (T >= 2.68) add("Peste 2.5 Goluri", "O25", g.o25, null, 1.05);
  if (T <= 2.38) add("Sub 2.5 Goluri", "U25", 1 - g.o25, null, 1.02);
  if (T <= 2.62) add("Sub 3.5 Goluri", "U35", g.u35, null, 0.96);
  if (lH >= 0.95 && lA >= 0.95 && T >= 2.55) add("GG (Ambele marchează)", "GG", g.gg, null, 1.04);
  if (winDiff >= 0.12 && T >= 2.38) add("1X & Peste 1.5 Goluri", "COMBO_DC", g.dc1X_o15, null, 1.05);
  if (winDiff <= -0.12 && T >= 2.38) add("X2 & Peste 1.5 Goluri", "COMBO_DC", g.dcX2_o15, null, 1.05);
  if (winDiff >= 0.25 && T >= 2.55) add("1 & Peste 1.5 Goluri", "COMBO_SOLO", g.h_o15, null, 1.05);
  if (winDiff <= -0.25 && T >= 2.55) add("2 & Peste 1.5 Goluri", "COMBO_SOLO", g.a_o15, null, 1.05);
  if (winDiff >= 0.38 && T >= 2.95) add("1 & Peste 2.5 Goluri", "COMBO_SOLO", g.h_o25, null, 1.04);
  if (winDiff >= 0.08 && T <= 2.62) add("1X & Sub 3.5 Goluri", "COMBO_U35", g.dc1X_u35, null, 1.02);
  if (winDiff <= -0.08 && T <= 2.62) add("X2 & Sub 3.5 Goluri", "COMBO_U35", g.dcX2_u35, null, 1.02);

  // Filtrul principal cere acum cotă realistă >= 1.25 (deci opțiunile de @1.04-@1.16 sunt respinse automat)
  let pool = c.filter(x => x.p >= 0.56 && x.p <= 0.79 && x.odd >= 1.25 && x.odd <= 2.20);
  if (!pool.length) pool = c.filter(x => x.odd >= 1.22 && x.odd <= 2.35);
  if (!pool.length) pool = c;
  pool.sort((a, b) => b.utility - a.utility);
  const best = pool[0];

  // Pool dedicat pentru Challenge 16 Zile: caută opțiuni cu cotă REALĂ între @1.20 și @1.34 (pentru ca 2 meciuri să dea ~@1.50 pe Superbet)
  const chalCornerOpt = selectOptimalStatLine(expC, [7.5, 8.5], [10.5, 11.5]);
  const chalCardOpt = selectOptimalStatLine(expK, [3.5], [5.5]);
  const chalPool = [
    ...c.map(x => ({ name: x.name, mk: x.mk, p: x.p, odd: x.odd })),
    { name: `Cornere ${chalCornerOpt.label}`, mk: "CORNERS", p: chalCornerOpt.prob / 100, odd: calcRealisticOdd(chalCornerOpt.prob / 100) },
    { name: `Cartonașe ${chalCardOpt.label}`, mk: "CARDS", p: chalCardOpt.prob / 100, odd: calcRealisticOdd(chalCardOpt.prob / 100) }
  ].filter(x => x.odd >= 1.20 && x.odd <= 1.35 && x.p >= 0.66 && x.p <= 0.79);

  chalPool.sort((a, b) => (b.p - Math.abs(b.odd - 1.24) * 0.55) - (a.p - Math.abs(a.odd - 1.24) * 0.55));
  const chalBest = chalPool[0] || { name: best.name, mk: best.mk, p: best.p, odd: best.odd };

  return {
    id: ev.id, league: lg.name, icon: lg.icon, cat: lg.cat, date: roDateStr(dt), time: roTimeStr(dt),
    status: stState === "post" ? "FT" : (stState === "in" ? "LIVE" : "NS"),
    home: hName, away: aName, hScore: sc(home), aScore: sc(away), hHT: ht(home), aHT: ht(away),
    hForm: hProf.formLabel, aForm: aProf.formLabel, lamH: lH.toFixed(2), lamA: lA.toFixed(2),
    isDerby, lowData, src, hasMktOdds: hasMkt, edgePct: best.edge || 0,
    pick: best.name, mktType: best.mk, prob: Math.round(best.p * 100), odd: best.odd, fairOdd: best.fairOdd, oddReal: best.real,
    chalPick: chalBest.name, chalProb: Math.round(chalBest.p * 100), chalOdd: chalBest.odd,
    tipsterScore: best.utility * (src === "market" ? 1.0 : (lowData ? 0.72 : 0.88)),
    expCorners: expC.toFixed(1), cornerLine: `${co.label} (${co.prob}%)`,
    actualCorners: (hc !== null && ac !== null) ? hc + ac : null,
    expCards: expK.toFixed(1), cardLine: `${ko.label} (${ko.prob}%)`,
    actualCards: (hy !== null && ay !== null) ? hy + ay + hr + ar : null,
    probs: { p1: Math.round(g.H*100), pX: Math.round(g.D*100), p2: Math.round(g.A*100), o25: Math.round(g.o25*100), gg: Math.round(g.gg*100), o15: Math.round(g.o15*100) }
  };
}

function checkBetOutcome(pick, h, a, hHT = null, aHT = null, actualCorners = null, actualCards = null) {
  if (!pick || h == null || a == null) return null;
  const t = h + a;

  if (pick.startsWith("Cornere ")) {
    if (actualCorners == null) return null;
    const m = pick.match(/(Peste|Sub)\s+([\d.]+)/);
    if (!m) return null;
    return m[1] === "Peste" ? actualCorners > parseFloat(m[2]) : actualCorners < parseFloat(m[2]);
  }
  if (pick.startsWith("Cartonașe ")) {
    if (actualCards == null) return null;
    const m = pick.match(/(Peste|Sub)\s+([\d.]+)/);
    if (!m) return null;
    return m[1] === "Peste" ? actualCards > parseFloat(m[2]) : actualCards < parseFloat(m[2]);
  }

  if (pick.startsWith("1 (")) return h > a;
  if (pick.startsWith("2 (")) return a > h;
  if (pick === "Sub 3.5 Goluri") return t <= 3;
  if (pick === "1 & Peste 1.5 Goluri") return h > a && t >= 2;
  if (pick === "2 & Peste 1.5 Goluri") return a > h && t >= 2;
  if (pick === "1 & Peste 2.5 Goluri") return h > a && t >= 3;
  if (pick === "2 & Peste 2.5 Goluri") return a > h && t >= 3;
  if (pick.startsWith("PSF 1")) return h > a || (hHT !== null && aHT !== null && hHT > aHT);
  if (pick.startsWith("PSF 2")) return a > h || (hHT !== null && hHT !== null && aHT > hHT);
  if (pick.includes("1X & Peste 1.5")) return h >= a && t >= 2;
  if (pick.includes("X2 & Peste 1.5")) return a >= h && t >= 2;
  if (pick.includes("1X & Sub 3.5")) return h >= a && t <= 3;
  if (pick.includes("X2 & Sub 3.5")) return a >= h && t <= 3;
  if (pick.includes("Peste 2.5")) return t >= 3;
  if (pick.includes("Sub 2.5")) return t <= 2;
  if (pick.includes("Peste 1.5")) return t >= 2;
  if (pick.includes("GG")) return h > 0 && a > 0;
  if (pick.includes("1X")) return h >= a;
  if (pick.includes("X2")) return a >= h;
  return null;
}

function calculateSmartStake(bankroll, m) {
  let pct = 0.04;
  if (m.edgePct && m.edgePct > 2) {
    const p = m.prob / 100, b = Math.max(0.25, m.odd - 1), kelly = ((p * b - (1 - p)) / b) * 0.30;
    pct = Math.max(0.03, Math.min(0.08, kelly));
  } else {
    if (m.prob >= 66) pct = 0.07; else if (m.prob >= 60) pct = 0.06; else if (m.prob >= 55) pct = 0.05; else pct = 0.04;
  }
  if (m.lowData) pct = Math.min(pct, 0.03);
  return { stake: Math.max(10, Math.round((bankroll * pct) / 5) * 5), pct: Math.round(pct * 100) };
}

function buildOptimalTicket(pool, targetOdd) {
  const target = cota500Mode ? 500 : targetOdd, maxLegs = cota500Mode ? 15 : 11;
  const s = [...(pool || [])].sort((a, b) => b.tipsterScore - a.tipsterScore);
  const picks = []; let tot = 1;
  for (const m of s) {
    if (picks.length >= maxLegs || tot >= target * 0.94) break;
    picks.push({ home: m.home, away: m.away, pick: m.pick, odd: m.odd, prob: m.prob });
    tot *= m.odd;
  }
  return { picks, totalOdd: tot };
}

// ===== JURNAL DE CALIBRARE MODEL =====
const LOG_KEY = "joe_pred_log_v1";
const getLog = () => { try { return JSON.parse(localStorage.getItem(LOG_KEY) || "{}"); } catch(e) { return {}; } };
const saveLog = l => { try { localStorage.setItem(LOG_KEY, JSON.stringify(l)); } catch(e) {} };
function logAndSettle(list) {
  const L = getLog(); let ch = false;
  (list || []).forEach(m => {
    const k = String(m.id);
    if (m.status === "NS" && !L[k]) { L[k] = { date: m.date, match: m.home + " vs " + m.away, pick: m.pick, p: m.prob / 100, src: m.src, res: null }; ch = true; }
    if (m.status === "FT" && m.hScore != null && L[k] && L[k].res === null) {
      const w = checkBetOutcome(L[k].pick, m.hScore, m.aScore, m.hHT, m.aHT, m.actualCorners, m.actualCards);
      if (w !== null) { L[k].res = w ? 1 : 0; ch = true; }
    }
  });
  if (ch) saveLog(L);
}
function calibCard() {
  const all = Object.values(getLog()), rows = all.filter(r => r.res !== null);
  const avg = x => x.reduce((s, r) => s + r.p, 0) / x.length, hit = x => x.reduce((s, r) => s + r.res, 0) / x.length;
  let body = `Nicio predicție încheiată încă (${all.length} înregistrate înainte de meci).`;
  if (rows.length) {
    const brier = rows.reduce((s, r) => s + (r.p - r.res) ** 2, 0) / rows.length;
    const bins = [[.55,.65],[.65,.72],[.72,.80],[.80,1.01]].map(([a, b]) => {
      const x = rows.filter(r => r.p >= a && r.p < b);
      return x.length ? `<div>${Math.round(a*100)}–${Math.min(100,Math.round(b*100))}%: prezis <b>${Math.round(avg(x)*100)}%</b> · real <b>${Math.round(hit(x)*100)}%</b> (${x.length})</div>` : "";
    }).join("");
    body = `<div>Încheiate: <b>${rows.length}</b> · în așteptare: ${all.length - rows.length} · Brier: <b>${brier.toFixed(3)}</b> (0.250 = monedă)</div>
      <div>Prezis în medie <b>${Math.round(avg(rows)*100)}%</b> · real <b>${Math.round(hit(rows)*100)}%</b></div>${bins}
      ${rows.length < 100 ? '<div style="color:var(--neon-gold);margin-top:4px;">Sub 100 de predicții: diferențele sunt în limita întâmplării.</div>' : ""}`;
  }
  return `<div class="cyber-card" style="margin-top:14px;"><div style="font-family:'Orbitron',sans-serif;font-size:12px;font-weight:900;color:var(--neon-cyan);margin-bottom:8px;">📐 CALIBRARE MODEL (JURNAL PREDICȚII)</div><div style="font-size:11px;line-height:1.7;color:var(--text-muted);">${body}<div style="margin-top:6px;">Jurnalul e păstrat doar pe acest dispozitiv.</div></div></div>`;
}

function recalcBankroll(shouldSave = true) {
  let b = project.initial_bankroll || 500.0;
  (project.bets || []).forEach(bet => { if (bet.status === "WIN") b += bet.stake * (bet.odd - 1); else if (bet.status === "LOSS") b -= bet.stake; });
  project.bankroll = +b.toFixed(2);
  const topBankroll = document.getElementById("topBankroll");
  if(topBankroll) topBankroll.innerText = project.bankroll.toFixed(2);
  if (shouldSave) saveToDB();
}

function autoSettleProjectBets(list) {
  let ch = false;
  (project.bets || []).forEach(b => {
    if (b.status !== "PENDING") return;
    const f = list.find(m => String(m.id) === String(b.matchId) && m.status === "FT");
    if (f && f.hScore !== null) {
      const w = checkBetOutcome(b.pick, f.hScore, f.aScore, f.hHT, f.aHT, f.actualCorners, f.actualCards);
      if (w !== null) { b.status = w ? "WIN" : "LOSS"; b.score = `${f.hScore}-${f.aScore}`; ch = true; }
    }
  });
  if (ch) recalcBankroll(true);
}

function addMatchToProject(matchId) {

function compressImageFile(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height; const M = 1100;
        if (w > M || h > M) { if (w > h) { h = Math.round(h * M / w); w = M; } else { w = Math.round(w * M / h); h = M; } }
        const cv = document.createElement("canvas"); cv.width = w; cv.height = h; cv.getContext("2d").drawImage(img, 0, 0, w, h);
        res({ base64: cv.toDataURL("image/jpeg", 0.82), mimeType: "image/jpeg" });
      };
      img.onerror = () => res({ base64: e.target.result, mimeType: file.type || "image/jpeg" });
      img.src = e.target.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

function getTodayChallengePicks() {
  const dayPool = cacheByDate[selectedDate] || [];
  let valid = dayPool.filter(m => m.status === "NS");
  if (valid.length < 2) valid = [...dayPool];
  valid.sort((a, b) => ((b.chalProb || b.prob) * (b.src === "market" ? 1.05 : 0.92)) - ((a.chalProb || a.prob) * (a.src === "market" ? 1.05 : 0.92)));

  const topPool = valid.slice(0, 12).map(m => ({
    id: m.id,
    home: m.home,
    away: m.away,
    league: m.league,
    time: m.time,
    pick: m.chalPick || m.pick,
    prob: m.chalProb || m.prob,
    odd: m.chalOdd || m.odd
  }));

  if (topPool.length < 2) {
    const rawOdd = topPool.length ? topPool[0].odd : 1.50;
    return { picks: topPool, totOdd: +rawOdd.toFixed(2) };
  }

  let bestPair = [topPool[0], topPool[1]];
  let bestScore = -999;
  for (let i = 0; i < topPool.length; i++) {
    for (let j = i + 1; j < topPool.length; j++) {
      const m1 = topPool[i], m2 = topPool[j];
      const prodOdd = +(m1.odd * m2.odd).toFixed(2);
      const jointProb = (m1.prob / 100) * (m2.prob / 100);
      const distFrom150 = Math.abs(prodOdd - 1.52);
      const score = jointProb - distFrom150 * 0.45;
      if (score > bestScore) {
        bestScore = score;
        bestPair = [m1, m2];
      }
    }
  }
  const realProductOdd = +(bestPair[0].odd * bestPair[1].odd).toFixed(2);
  return { picks: bestPair, totOdd: realProductOdd };
}

function settleChallengeDay(outcome) {
  const st = getStoredChallengeState();
  let currentActive = st.history.find(h => h.id === st.activeId);
  if (!currentActive) {
    currentActive = { id: st.activeId, status: 'RUNNING', currentDay: st.currentDay, startStake: 10.0, finalReturn: 0.0, maxReached: 10.0, steps: [] };
    st.history.push(currentActive);
  }

  const { picks, totOdd } = getTodayChallengePicks();
  const effOdd = customChallengeOdd && customChallengeOdd > 1.05 ? customChallengeOdd : totOdd;
  const usedStake = +st.currentStake.toFixed(2);
  const returnAmount = +(usedStake * effOdd).toFixed(2);
  const summaryText = picks.map(p => `${p.home} vs ${p.away}: ${p.pick} (@${p.odd.toFixed(2)})`).join(" + ");

  currentActive.currentDay = st.currentDay;
  currentActive.steps.push({
    day: st.currentDay,
    date: selectedDate,
    stake: usedStake,
    odd: effOdd,
    returnAmount: outcome === 'WIN' ? returnAmount : 0,
    summary: summaryText,
    status: outcome
  });

  customChallengeOdd = null;

  if (outcome === 'WIN') {
    currentActive.maxReached = Math.max(currentActive.maxReached || 10, returnAmount);
    if (st.currentDay >= 16) {
      currentActive.status = 'WIN';
      currentActive.finalReturn = returnAmount;
      alert(`🏆 FELICITĂRI! Ai dus Challenge #${st.activeId} până la capăt (Ziua 16) și ai ajuns la ${returnAmount} RON! Pornim acum Challenge #${st.activeId + 1} de la 10 RON.`);
      st.activeId += 1;
      st.currentDay = 1;
      st.currentStake = 10.0;
      st.history.push({ id: st.activeId, status: 'RUNNING', currentDay: 1, startStake: 10.0, finalReturn: 0.0, maxReached: 10.0, startedAt: selectedDate, steps: [] });
    } else {
      st.currentDay += 1;
      st.currentStake = returnAmount;
      currentActive.currentDay = st.currentDay;
    }
  } else {
    currentActive.status = 'LOSS';
    currentActive.finalReturn = 0;
    alert(`✖ Bilet pierdut în Ziua ${st.currentDay}. Challenge #${st.activeId} a fost salvat în istoric. Pornim Challenge #${st.activeId + 1} de la Ziua 1 cu miza de 10 RON!`);
    st.activeId += 1;
    st.currentDay = 1;
    st.currentStake = 10.0;
    st.history.push({ id: st.activeId, status: 'RUNNING', currentDay: 1, startStake: 10.0, finalReturn: 0.0, maxReached: 10.0, startedAt: selectedDate, steps: [] });
  }

  saveStoredChallengeState(st);
  renderViewport();
}

function computeRealPerformanceStats(dayPool) {
  const settledBets = (project.bets || []).filter(b => b.status === "WIN" || b.status === "LOSS");
  const wonBets = settledBets.filter(b => b.status === "WIN").length;
  const ftMatches = (dayPool || []).filter(m => m.status === "FT" && m.hScore !== null && m.aScore !== null);
  let ftHits = 0;
  ftMatches.forEach(m => { if (checkBetOutcome(m.pick, m.hScore, m.aScore, m.hHT, m.aHT, m.actualCorners, m.actualCards) === true) ftHits++; });
  let winRateText = "În calcul";
  if (settledBets.length > 0) winRateText = `${Math.round((wonBets / settledBets.length) * 100)}% (${wonBets}/${settledBets.length})`;
  else if (ftMatches.length > 0) winRateText = `${Math.round((ftHits / ftMatches.length) * 100)}% (${ftHits}/${ftMatches.length} azi)`;
  let avgOddText = "—";
  if ((project.bets || []).length > 0) avgOddText = (project.bets.reduce((acc, b) => acc + (parseFloat(b.odd) || 1.5), 0) / project.bets.length).toFixed(2);
  else if (dayPool && dayPool.length > 0) avgOddText = (dayPool.reduce((acc, m) => acc + m.odd, 0) / dayPool.length).toFixed(2);
  return { winRateText, avgOddText };
}

  const n = picks.length;
  const joint = n ? picks.reduce((s, p) => s * (p.prob / 100), 1) : 0;
  const note = n ? `<div style="font-size:11px;line-height:1.5;color:var(--neon-gold);background:rgba(255,183,3,0.08);border:1px solid rgba(255,183,3,0.3);border-radius:10px;padding:8px 10px;margin-bottom:12px;">Șansa estimată ca toate cele ${n} selecții să iasă: <b>${(joint*100).toFixed(joint<0.01?2:1)}%</b> (aprox. 1 din ${Math.max(1, Math.round(1/joint)).toLocaleString("ro-RO")}). ${cota500Mode && tot < 500 ? `Cota 500 nu poate fi atinsă onest cu meciurile de azi: total real @${tot.toFixed(2)}. ` : ""}Cotele sunt calibrate pe marja agențiilor; verifică-le pe bilet înainte de a paria.</div>` : "";

  const contentBody = `<div style="display:flex;justify-content:space-between;padding-bottom:8px;margin-bottom:10px;border-bottom:1px solid var(--card-border);font-family:'Orbitron',sans-serif;font-size:12px;">
    <span>Cotă Totală (${picks.length} selecții): <b style="color:var(--neon-green);">@${tot.toFixed(2)}</b></span>
    <span>Câștig Est.: <b style="color:var(--neon-gold);"><span id="potWinLabel">${potentialWin}</span> RON</b></span>
  </div>
  ${rows || '<div style="text-align:center;color:var(--text-muted);padding:16px;">Nu sunt suficiente meciuri în această zi.</div>'}`;

  return `<div class="cyber-card" id="biletCardContainer">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <span style="font-family:'Orbitron',sans-serif;font-size:13px;font-weight:900;color:var(--neon-gold);">🎟️ Generator Bilet Smart (${selectedDate})</span>
      <button class="cyber-btn copy-btn" style="flex:0.4;padding:6px 10px;" onclick="copyCurrentTicket()">📋 Copiază</button>
    </div>
    
    <div style="background:rgba(2,4,8,0.7);padding:10px;border-radius:12px;border:1px solid var(--card-border);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:11px;font-family:'Orbitron',sans-serif;color:var(--text-muted);">BUGETUL TĂU (RON):</span>
      <input type="number" id="budgetInput" class="cyber-input" style="width:110px;margin:0;padding:6px 10px;text-align:right;font-family:'Orbitron',sans-serif;font-weight:900;color:var(--neon-green);" value="${customBudget}" oninput="customBudget=parseFloat(this.value)||0;const el=document.getElementById('potWinLabel');if(el)el.innerText=+(customBudget*currentTicketTotalOdd).toFixed(2);">
    </div>

    <div class="toggle-container" id="toggleBoxCota500">
      <span style="font-size:11px;font-family:'Orbitron',sans-serif;color:var(--neon-gold);font-weight:800;">🔥 Activează Modul Cotă 500+ (meciuri diferite)</span>
      <label class="switch">
        <input type="checkbox" id="toggleCota500" ${cota500Mode ? 'checked' : ''} onchange="toggleCota500Action(this)">
        <span class="slider"></span>
      </label>
    </div>

    ${note}
    <div class="h-scroll" style="margin-bottom:12px;">${btns}</div>
    ${contentBody}
  </div>

  <div class="cyber-card" style="border-color:var(--neon-cyan);margin-top:14px;">
    <div style="font-family:'Orbitron',sans-serif;font-size:12px;font-weight:900;color:var(--neon-cyan);margin-bottom:8px;">📊 PERFORMANȚĂ REALĂ PORTOFOLIU & MODEL</div>
    <div style="font-size:11px;color:var(--text-muted);line-height:1.5;margin-bottom:10px;">Statistici calculate live din istoricul pariurilor salvate în Joe Vault și rezultatele înregistrate.</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;">
      <div style="background:rgba(2,4,8,0.5);padding:8px;border-radius:10px;border:1px solid var(--card-border);"><span class="v-lbl">Win Rate Real</span><div style="font-family:'Orbitron',sans-serif;font-weight:900;color:var(--neon-green);font-size:11px;margin-top:2px;">${realStats.winRateText}</div></div>
      <div style="background:rgba(2,4,8,0.5);padding:8px;border-radius:10px;border:1px solid var(--card-border);"><span class="v-lbl">Medie Cotă</span><div style="font-family:'Orbitron',sans-serif;font-weight:900;color:var(--neon-gold);font-size:12px;margin-top:2px;">${realStats.avgOddText}</div></div>
      <div style="background:rgba(2,4,8,0.5);padding:8px;border-radius:10px;border:1px solid var(--card-border);"><span class="v-lbl">Motor Statistic</span><div style="font-family:'Orbitron',sans-serif;font-weight:900;color:var(--neon-cyan);font-size:10px;margin-top:2px;">MODEL CALIBRAT</div></div>
    </div>
  </div>
  ${calibCard()}`;
}

function selectTicketOdd(odd) { cota500Mode = false; targetTicketOdds = odd; renderViewport(); }

function toggleCota500Action(checkbox) {
  cota500Mode = checkbox.checked;
  targetTicketOdds = cota500Mode ? 500 : 5;
  renderViewport();
  const card = document.getElementById("biletCardContainer");
  if (card) { card.classList.remove("boom-active"); void card.offsetWidth; card.classList.add("boom-active"); }
}

function renderViewport() {
  renderSubBars();
  const vp = document.getElementById("viewport");
  if(!vp) return;
  if (currentNav === "admin" && isAdmin()) { vp.innerHTML = renderAdminView(); return; }
  if (currentNav === "proiect" && hasJoeAccess()) { vp.innerHTML = renderProjectView(); setTimeout(updateChatUI, 40); return; }
  if (currentNav === "challenge") { vp.innerHTML = renderChallengeView(); return; }
  if (currentNav === "bilete") { vp.innerHTML = renderTicketsView(); return; }
  
  const searchTerm = (document.getElementById("matchSearchInput")?.value || "").toLowerCase().trim();
  let list = currentNav === "europa" ? europaMatches : (cacheByDate[selectedDate] || []).filter(m => selectedLeague === "ALL" || m.league === selectedLeague);
  if (searchTerm) list = list.filter(m => m.home.toLowerCase().includes(searchTerm) || m.away.toLowerCase().includes(searchTerm) || m.league.toLowerCase().includes(searchTerm));
  if (!list.length) { vp.innerHTML = `<div class="cyber-card" style="text-align:center;padding:26px;color:var(--text-muted);">Niciun meci găsit conform căutării sau programat în această zi.</div>`; return; }
  
  const groups = {};
  list.forEach(m => { if (!groups[m.league]) groups[m.league] = { icon: m.icon, items: [] }; groups[m.league].items.push(m); });
  vp.innerHTML = Object.keys(groups).map(lg => `<div class="cyber-sec-head"><span>${groups[lg].icon} ${esc(lg)}</span><span>${groups[lg].items.length} meciuri</span></div>${groups[lg].items.map(renderMatchCard).join("")}`).join("");
}

function selectDay(iso) {
  selectedDate = iso; selectedLeague = "ALL";
  customChallengeOdd = null;
  const searchInput = document.getElementById("matchSearchInput");
  if(searchInput) searchInput.value = "";
  loadMatchesForDate(iso);
}

function selectLeague(lg) { selectedLeague = lg; renderViewport(); }

async function switchNav(tab) {
  if (tab === "proiect" && !hasJoeAccess()) return;
  if (tab === "admin" && !isAdmin()) return;
  currentNav = tab;
  document.querySelectorAll(".hud-nav-item").forEach(b => b.classList.remove("active"));
  const btn = document.getElementById("nav-" + tab);
  if (btn) btn.classList.add("active");
  if (tab === "admin") await fetchAdminUsersList();
  if (tab === "europa") loadEuropaMatches(); else renderViewport();
}

(async function startApp() {
  // Ștergem cache-ul vechi de meciuri ca să forțăm recalcularea cotelor reale
  Object.keys(localStorage).forEach(k => { if (k.startsWith("joe_cache_") && !k.startsWith("joe_cache_v5_")) localStorage.removeItem(k); });
  selectedDate = getDatesList()[1].iso;
  const savedUser = localStorage.getItem("xmts_logged_user");
  const savedAdmToken = sessionStorage.getItem("xmts_adm_token");
  if (savedUser) {
    try {
      const parsed = JSON.parse(savedUser);
      const isExpired = parsed.role !== "admin" && parsed.expires_at && new Date(parsed.expires_at) < new Date();
      if (!isExpired && parsed.username) {
        currentUser = parsed;
        if (parsed.role === "admin" && savedAdmToken) { adminSessionPass = savedAdmToken; await fetchAdminUsersList(); }
        document.getElementById("loginScreen").style.display = "none";
        applyRolePermissions();
      } else {
        localStorage.removeItem("xmts_logged_user");
      }
    } catch (e) {}
  }
  await initProject();
  loadMatchesForDate(selectedDate);
})();
</script>
</body>
</html>
